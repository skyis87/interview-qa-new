<script type="application/json" id="oldDefaults">[{"id": 1, "answer": "鄭（テイ）と申します。台湾出身で、来日5年目になります。日本語能力試験N1に合格しています。\nITエンジニアとして約3年半の経験があります。これまで、自治体向けの施設予約システム、物流管理システム、銀行向けシステム、製造業向けWebシステムを経験しました。\n主にJava、JavaScript、SQLを使い、詳細設計、製造、単体テスト、結合テストを担当しました。また、社内サーバーやNASなどの運用保守も経験しています。\n分からないことは早めに確認し、チームと相談しながら仕事を進めることを大切にしています。本日はよろしくお願いいたします。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 2, "answer": "鄭（テイ）と申します。ITエンジニアとして約3年半の経験があります。\nJava、JavaScript、SQLを使ったWebシステム開発を経験し、詳細設計、製造、単体テスト、結合テストを担当しました。\nまた、社内サーバーやNASなどの運用保守も経験しています。これまでの経験を活かして、御社の仕事に貢献したいです。本日はよろしくお願いいたします。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "担当したのは、画面の入力チェック、検索・更新処理、テストなどです。案件によって担当範囲は異なりますが、主に詳細設計以降の作業を行いました。"}, {"id": 3, "answer": "これまで4つのプロジェクトを経験しました。\n1つ目は自治体向けの施設予約システムで、開発と社内ITインフラの運用保守を担当しました。\n2つ目は物流会社向けのシステムで、配送依頼をまとめる機能の開発とテストを担当しました。\n3つ目は銀行向けシステムで、詳細設計書の修正、テスト、臨時保守を担当しました。\n4つ目は製造業向けのWebシステムで、詳細設計、製造、単体テスト、結合テストを担当しています。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "担当したのは、画面の入力チェック、検索・更新処理、テストなどです。案件によって担当範囲は異なりますが、主に詳細設計以降の作業を行いました。"}, {"id": 4, "answer": "ITの実務経験は約3年半です。Webシステムの開発で、詳細設計書の修正や作成、プログラムの修正、単体テスト、結合テストを経験しました。また、問い合わせ調査や社内ITインフラの運用保守も経験しています。", "followup": "その期間で、主にどのような作業を担当しましたか？", "followupAnswer": "ITの実務経験は約3年半です。Webシステムの開発で、詳細設計書の修正や作成、プログラムの修正、単体テスト、結合テストを経験しました。また、問い合わせ調査や社内ITインフラの運用保守も経験しています。"}, {"id": 5, "answer": "プログラミングで何かを作ることに興味があったからです。自分が作ったシステムで仕事が便利になり、人の役に立てることにやりがいを感じています。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 6, "answer": "はい、対応できます。日本語能力試験N1に合格しています。まだ難しい説明に時間がかかることもありますが、仕事では報告・連絡・相談を大切にしています。分からないことは、そのままにせず確認します。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 7, "answer": "私の強みは、分からないことを確認しながら、最後まで責任を持って作業することです。仕様書に疑問がある , "answer": "現在の選考状況については、営業担当に確認していただければと思います。", "followup": "その条件について、もう少し詳しく教えてください。", "followupAnswer": "現場のルールや作業内容を確認したうえで、リーダーと相談しながら対応したいと考えています。"}, {"id": 17, "answer": "今のところ、帰国の予定はありません。日本で長く働きながら、ITエンジニアとして経験を積んでいきたいです。", "followup": "その条件について、もう少し詳しく教えてください。", "followupAnswer": "現場のルールや作業内容を確認したうえで、リーダーと相談しながら対応したいと考えています。"}, {"id": 18, "answer": "自治体向けの施設予約システムの開発と、社内ITインフラの運用保守を担当しました。予約システムでは、JavaとSpring MVCを使って予約の登録、変更、取消、一覧検索などを実装しました。また、Windows ServerやNAS、FTPサーバーなどの管理や、社内PCの設定・トラブル対応も行いました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "主に会議室や備品の予約登録、変更、キャンセル機能を担当しました。また、予約が重複しないようにチェックする処理も実装しました。"}, {"id": 19, "answer": "JavaとSpring MVCを使って、予約の登録、変更、取消機能を修正・開発しました。画面側ではJavaScriptやjQueryで入力チェックを行い、SQLで予約情報を検索・更新しました。同じ施設と時間に予約が重ならないよう、既存の予約を確認する処理も作りました。", "followup": "実際の案件での具体例を教えてください。", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 20, "answer": "難しかったのは、同じ施設と時間に予約が重ならないようにすることです。予約日や施設、備品の組み合わせを確認する必要がありました。正常な入力だけでなく、必須項目が空の場合や過去の日付の場合もテストしました。", "followup": "その問題をどのように解決しましたか？", "followupAnswer": "まず状況を整理し、仕様書やログ、ソースコードを確認しました。原因を切り分け、必要な修正と再テストを行いました。"}, {"id": 21, "answer": "物流会社向けの管理システム改修です。配送依頼の登録や変更、取消、配送状況の検索機能を修正しました。また、配送日や配送先などの条件が同じ依頼をまとめる機能を開発し、単体テストと結合テストも担当しました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。"}, {"id": 22, "answer": "配送日、配送先、配送区分などを確認して、条件が同じ配送依頼をまとめる機能です。Java、MyBatis、Oracleを使い、対象データの検索や更新、一覧表示の処理を修正しました。テストでは、対象がある場合とない場合、複数件をまとめる場合などを確認しました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。"}, {"id": 23, "answer": "Oracleは、配送依頼のデータを検索・更新するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎ、必要なデータを取得したり、更新したりしました。既存のSQLを確認しながら、必要な修正を行いました。", "followup": "その技術を使った具体的な作業を教えてください。", "followupAnswer": "JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。"}, {"id": 24, "answer": "銀行向けの管理システム改修です。融資の申込みや審査状況、顧客情報 する処理も作りました。","followup":"その案件で、ご自身が担当した処理を一つ具体的に説明してください。","followupAnswer":"第1案件は予約重複チェック、第2案件は配送依頼の統合、第3案件は顧客検索条件の修正、第4案件は受注登録・在庫照会です。該当案件に合わせて一つ選んで説明します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":20,"title":"第1プロジェクトで苦労した点は何ですか？","category":"プロジェクト","starred":false,"answer":"難しかったのは、同じ施設と時間に予約が重ならないようにすることです。予約日や施設、備品の組み合わせを確認する必要がありました。正常な入力だけでなく、必須項目が空の場合や過去の日付の場合もテストしました。","followup":"その問題をどのように解決しましたか？","followupAnswer":"まず状況を整理し、仕様書やログ、ソースコードを確認しました。原因を切り分け、必要な修正と再テストを行いました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":21,"title":"第2プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"物流会社向けの管理システム改修です。配送依頼の登録や変更、取消、配送状況の検索機能を修正しました。また、配送日や配送先などの条件が同じ依頼をまとめる機能を開発し、単体テストと結合テストも担当しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。","caseReference":"第2案件｜物流システム"},{"id":22,"title":"第2プロジェクトの配送依頼統合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"配送日、配送先、配送区分などを確認して、条件が同じ配送依頼をまとめる機能です。Java、MyBatis、Oracleを使い、対象データの検索や更新、一覧表示の処理を修正しました。テストでは、対象がある場合とない場合、複数件をまとめる場合などを確認しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。","caseReference":"第2案件｜物流システム"},{"id":23,"title":"第2プロジェクトでは、OracleとMyBatisをどのように使いましたか？","category":"プロジェクト","starred":false,"answer":"Oracleは、配送依頼のデータを検索・更新するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎ、必要なデータを取得したり、更新したりしました。既存のSQLを確認しながら、必要な修正を行いました。","followup":"その技術を使った具体的な作業を教えてください。","followupAnswer":"JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。","caseReference":"第2案件｜物流システム"},{"id":24,"title":"第3プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"銀行向けの管理システム改修です。融資の申込みや審査状況、顧客情報、口座情報を扱うシステムでした。私は詳細設計書の修正、画面や検索条件の修正、単体テスト、結合テストを担当しました。開発終了後は、問い合わせ調査などの臨時保守も行いました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"顧客情報の検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。また、問い合わせの調査も行いました。","caseReference":"第3案件｜銀行システム"},{"id":25,"title":"第3プロジェクトの顧客・口座情報の照合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"顧客情報と口座情報を確認する機能です。既存の設計書やソース、SQLを確認し、検索条件や重複候補の確認方法を整理しました。変更した内容が正しく動くか、単体テストや結合テストで確認しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"顧客情報の検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。また、問い合わせの調査も行いました。","caseReference":"第3案件｜銀行システム"},{"id":26,"title":"第3プロジェクトの権限制御について説明してください。","category":"プロジェクト","starred":false,"answer":"経歴書に書かれている範囲では、権限制御を主な担当として開発した経験はありません。銀行向けシステムでは、画面項目や入力チェック、検索条件の修正を担当しました。権限に関する作業が必要な場合は、既存仕様を確認して対応します。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"顧客情報の検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。また、問い合わせの調査も行いました。","caseReference":"第3案件｜銀行システム"},{"id":27,"title":"第3プロジェクトの臨時保守やログ調査について説明してください。","category":"プロジェクト","starred":false,"answer":"銀行向けシステムの開発が終わった後、問い合わせ調査や軽い不具合の修正、データ確認の依頼に対応しました。Linuxのログや既存のShellスクリプトを確認して、原因調査を手伝いました。分からない点はリーダーに報告して確認しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"顧客情報の検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。また、問い合わせの調査も行いました。","caseReference":"第3案件｜銀行システム"},{"id":28,"title":"第4プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"製造業向けの管理Webシステムの新規開発です。受注、発注、在庫、出荷の業務を管理するシステムです。私は詳細設計書の作成、Javaでの製造、単体テスト、結合テストを担当しています。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"受注登録、在庫照会、出荷指示などの機能を担当しました。詳細設計書の作成から実装、単体テストまで行いました。","caseReference":"第4案件｜製造業Web"},{"id":29,"title":"第4プロジェクトの出荷指示統合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"複数の受注を出荷単位にまとめる機能です。詳細設計書では、まとめる条件、在庫の確認、在庫が足りない時のエラー、まとめた後のデータ更新などを整理しました。その後、Javaで実装し、テストを行いました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"受注登録、在庫照会、出荷指示などの機能を担当しました。詳細設計書の作成から実装、単体テストまで行いました。","caseReference":"第4案件｜製造業Web"},{"id":30,"title":"第4プロジェクトの受注登録や在庫照会機能について説明してください。","category":"プロジェクト","starred":false,"answer":"受注登録では、入力された内容を確認して登録する処理を作りました。在庫照会では、条件に合う在庫データを検索して画面に表示します。在庫が足りない場合や入力に問題がある場合も、正しく処理されるか確認しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"受注登録、在庫照会、出荷指示などの機能を担当しました。詳細設計書の作成から実装、単体テストまで行いました。","caseReference":"第4案件｜製造業Web"},{"id":31,"title":"第4プロジェクトでThymeleafやMySQLをどのように使いましたか？","category":"プロジェクト","starred":false,"answer":"Thymeleafは、サーバーから受け取ったデータを画面に表示するために使いました。MySQLは、受注や在庫などのデータを保存・検索するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎました。","followup":"その技術を使った具体的な作業を教えてください。","followupAnswer":"JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。","caseReference":"第4案件｜製造業Web"},{"id":32,"title":"4つの案件の中で一番自信がある案件はどれですか？","category":"プロジェクト","starred":false,"answer":"一番自信があるのは、4つ目の製造業向けWebシステムです。詳細設計書の作成からJavaの製造、単体テスト、結合テストまで経験しました。特に、受注や在庫、出荷に関する機能を通して、画面からデータベースまでの流れを学びました。","followup":"その案件で、ご自身が担当した処理を一つ具体的に説明してください。","followupAnswer":"第1案件は予約重複チェック、第2案件は配送依頼の統合、第3案件は顧客検索条件の修正、第4案件は受注登録・在庫照会です。該当案件に合わせて一つ選んで説明します。","caseReference":"第4案件｜製造業Web"},{"id":33,"title":"案件ごとの成長を説明してください。","category":"プロジェクト","starred":false,"answer":"1つ目の案件では、Javaでの画面機能の開発と社内ITの運用保守を経験しました。2つ目では、配送依頼をまとめる機能とテストを経験しました。3つ目では、詳細設計書の修正や臨時保守を経験しました。4つ目では、詳細設計書の作成から製造、テストまで経験し、できる仕事の範囲が広がりました。","followup":"その案件で、ご自身が担当した処理を一つ具体的に説明してください。","followupAnswer":"第1案件は予約重複チェック、第2案件は配送依頼の統合、第3案件は顧客検索条件の修正、第4案件は受注登録・在庫照会です。該当案件に合わせて一つ選んで説明します。","caseReference":""},{"id":34,"title":"詳細設計の経験はありますか？","category":"設計","starred":false,"answer":"はい、あります。第4プロジェクトの製造業向けWebシステムでは、受注登録や在庫照会などの機能について、詳細設計書の作成・修正を担当しました。第3プロジェクトでは、銀行向けシステムの既存設計書を修正しました。基本設計は担当していません。","followup":"具体的に何を記載しましたか？","followupAnswer":"第4プロジェクトでは、画面項目、入力チェック、ボタン操作時の処理、データ取得条件などを整理しました。","caseReference":"第4案件｜製造業Web"},{"id":35,"title":"詳細設計書はどうやって書きましたか？","category":"設計","starred":false,"answer":"第4プロジェクトでは、基本設計書や既存の設計書を確認し、画面ごとに詳細設計書を作成しました。画面項目や処理の流れ、SQLの取得条件を整理し、リーダーのレビュー後に指摘を修正しました。","followup":"何を参考にしましたか？","followupAnswer":"基本設計書、既存画面の詳細設計書、関連するソースコードを参考にしました。分からない点はリーダーに確認しました。","caseReference":"第4案件｜製造業Web"},{"id":36,"title":"基本設計と詳細設計の違いを教えてください。","category":"設計","starred":false,"answer":"基本設計は、システムで何をするかを整理するものです。例えば、画面の概要や画面遷移、業務のルールなどを書きます。詳細設計は、それをもとに、プログラムを作れるように処理の流れや入力チェック、DBの検索・更新内容などを詳しく書くものです。","followup":"具体的には、どのような機能の詳細設計を担当しましたか？","followupAnswer":"基本設計の実務経験はありませんが、詳細設計では画面項目、入力チェック、検索条件、データベースの更新内容などをまとめました。","caseReference":""},{"id":37,"title":"詳細設計書の中には、どのような内容を書きましたか？","category":"設計","starred":false,"answer":"第4プロジェクトでは、画面レイアウト、項目定義、入力チェック、ボタンなどのイベント処理、DBからのデータ取得・更新処理を記載しました。特に項目定義と処理内容を確認しました。","followup":"画面項目定義には何を書きましたか？","followupAnswer":"項目名、入力形式、必須かどうか、文字数制限、表示内容、データの取得元などを整理しました。","caseReference":"第4案件｜製造業Web"},{"id":38,"title":"詳細設計書を何本くらい作成・修正しましたか？新規と改修の内訳も教えてください。","category":"設計","starred":false,"answer":"第3プロジェクトでは銀行向けシステムの既存の詳細設計書を修正し、第4プロジェクトでは製造業向けWebシステムの詳細設計書を新規作成しました。正確な本数は資料を確認してお答えします。","followup":"1本は何を数えていますか？","followupAnswer":"担当した画面や機能ごとに、設計書の単位を確認して数えます。","caseReference":"第3案件｜銀行システム"},{"id":39,"title":"なぜ詳細設計書を改修しましたか？","category":"設計","starred":false,"answer":"第3プロジェクトでは、検索条件や画面項目の仕様変更に合わせて、詳細設計書を修正しました。修正後は実装内容と設計書にずれがないか確認しました。","followup":"仕様変更があった場合、最初に何をしますか？","followupAnswer":"変更内容と影響する画面や処理を確認し、不明点をリーダーに相談してから設計書を修正します。","caseReference":"第3案件｜銀行システム"},{"id":40,"title":"詳細設計書は誰がレビューしましたか？どのように進めましたか？","category":"設計","starred":false,"answer":"第3・第4プロジェクトでは詳細設計に携わりました。レビューの担当者や進め方については、実際の作業記録を確認してお答えします。","followup":"どんな指摘がありましたか？","followupAnswer":"指摘を受けた場合は、内容を確認し、必要な箇所を修正して再確認します。","caseReference":"第3案件｜銀行システム"},{"id":41,"title":"詳細設計書を書く時に難しかったことは何ですか？","category":"設計","starred":false,"answer":"第4プロジェクトでは、在庫が不足した場合など、正常時以外の処理を整理することが難しい点でした。設計書と既存の処理を確認し、判断できない条件はリーダーに相談しました。","followup":"どのように解決しましたか？","followupAnswer":"正常系と異常系を分けて整理し、既存の処理を参考にしながら条件を確認しました。","caseReference":"第3案件｜銀行システム"},{"id":42,"title":"1本の詳細設計書を作成するには、どれくらい時間がかかりますか？","category":"設計","starred":false,"answer":"作成期間は画面の項目数や処理の複雑さによって変わります。基本設計書や既存の詳細設計書を確認しながら進めます。","followup":"時間が足りない場合はどうしますか？","followupAnswer":"期限に間に合わない可能性があれば、早めにリーダーへ相談します。","caseReference":"第3案件｜銀行システム"},{"id":43,"title":"他人の設計書をレビューした経験はありますか？レビュアーの経験はありますか？","category":"設計","starred":false,"answer":"他の人の設計書を正式にレビューする担当は経験していません。自分が作成した設計書について、リーダーから指摘を受けて修正した経験はあります。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":""},{"id":44,"title":"要件定義の経験はありますか？","category":"設計","starred":false,"answer":"要件定義を担当した経験はありません。これまでは、決められた要件や基本設計書を確認して、詳細設計、製造、テストを行ってきました。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":""},{"id":45,"title":"基本設計の経験はありますか？","category":"設計","starred":false,"answer":"基本設計を主担当として行った経験はありません。主に詳細設計、製造、単体テスト、結合テストを担当しました。基本設計書を参考にして詳細設計を進めた経験はあります。","followup":"基本設計書は読めますか？","followupAnswer":"はい。画面や機能の仕様を確認するために参照しました。ただし、基本設計書そのものを作成した経験はありません。","caseReference":""},{"id":46,"title":"DB設計の経験はありますか？","category":"設計","starred":false,"answer":"テーブルをゼロから設計した経験はありません。既存のテーブル定義書を確認し、SQLでデータを検索・更新したり、テスト前後のデータを確認したりしました。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":""},{"id":47,"title":"製造経験について説明してください。","category":"Java","starred":false,"answer":"第1プロジェクトではJavaとSpring MVCで予約管理機能を開発しました。第2プロジェクトでは物流システムの既存機能を修正し、第4プロジェクトでは受注・在庫・出荷関連の機能をJavaで実装しました。","followup":"具体的にどのような処理を作りましたか？","followupAnswer":"第1プロジェクトでは、予約日時や施設を確認して、重複予約を防ぐチェック処理を実装しました。","caseReference":"第4案件｜製造業Web"},{"id":48,"title":"既存コードや現行コードを見て、改修・追加開発できますか？","category":"Java","starred":false,"answer":"はい、できます。第2プロジェクトでは、物流管理システムの既存コードを確認し、配送依頼の検索・更新処理を修正しました。修正前に影響する処理を確認し、修正後にテストしました。","followup":"既存コードを理解する手順は？","followupAnswer":"まず仕様書と処理の入口を確認し、ControllerからService、Mapperまで処理を追います。","caseReference":"第2案件｜物流システム"},{"id":49,"title":"システムを0から設計・製造した経験はありますか？","category":"Java","starred":false,"answer":"基本設計からシステム全体をゼロから作った経験はありません。第4プロジェクトでは、既存資料や基本設計書をもとに、担当機能の詳細設計と製造を行いました。","followup":"資料がない場合はどうしますか？","followupAnswer":"要件や期待する動作をリーダーに確認し、似た機能や既存コードを調べてから進めます。","caseReference":"第4案件｜製造業Web"},{"id":50,"title":"Controller、Service、Mapperの役割を説明してください。","category":"Java","starred":false,"answer":"Controllerは画面などからのリクエストを受け取ります。Serviceは業務の処理を行います。MapperはSQLを使ってデータベースにアクセスします。役割を分けることで、コードを整理しやすくなります。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":51,"title":"MVCについて説明してください。","category":"Java","starred":false,"answer":"MVCは、画面、処理、データを分けて作る考え方です。Viewは画面、Controllerはリクエストの受付、Modelはデータや処理を担当します。役割を分けることで、修正しやすくなります。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":52,"title":"Spring Bootを使った経験を説明してください。","category":"Java","starred":false,"answer":"製造業向けのWebシステムでSpringを使いました。詳細設計書をもとに、受注登録や在庫照会、出荷指示に関する機能を実装し、MyBatisを使ってデータベースと連携しました。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":53,"title":"Spring MVCとSpring Bootの違いを説明してください。","category":"Java","starred":false,"answer":"Spring MVCは、Web画面やリクエストを処理するための仕組みです。Spring Bootは、開発に必要な設定を簡単にして、アプリケーションを始めやすくする仕組みです。Spring Bootでは、設定を少なくして開発を進められます。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":54,"title":"MyBatisを使った経験を説明してください。","category":"Java","starred":false,"answer":"第2プロジェクトでは、Oracleの配送依頼データを扱うためにMyBatisを使用しました。MapperのSQLで検索・更新し、Java側から呼び出す処理を確認・修正しました。第4プロジェクトでもMyBatisとMySQLを使用しました。","followup":"Mapperでは何を確認しましたか？","followupAnswer":"SQLの検索条件、パラメータ、取得結果の対応、更新対象が正しいかを確認しました。","caseReference":"第2案件｜物流システム"},{"id":55,"title":"JSPとThymeleafの違いを説明してください。","category":"Java","starred":false,"answer":"JSPもThymeleafも、サーバー側のデータを画面に表示するために使います。JSPはJavaのWeb画面で使われる仕組みです。ThymeleafはHTMLの属性を使ってデータを表示するため、HTMLの形を見ながら作りやすいです。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":56,"title":"JavaScript、jQuery、Ajaxの経験を説明してください。","category":"Java","starred":false,"answer":"第1プロジェクトでは、JavaScriptとjQueryを使って予約画面の入力チェックやボタン操作を実装しました。第4プロジェクトでは、画面の表示や入力項目の制御にも関わりました。","followup":"どのようなイベント処理ですか？","followupAnswer":"例えば、登録ボタンを押したときに必須項目を確認し、問題があればエラーメッセージを表示します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":57,"title":"JSONとは何ですか？どこで使いましたか？","category":"Java","starred":false,"answer":"JSONは、データを文字列の形でやり取りするための形式です。キーと値の組み合わせでデータを表します。経歴書ではJSON形式の入出力項目を扱った経験があります。","followup":"その技術を使った具体的な作業を教えてください。","followupAnswer":"JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。","caseReference":""},{"id":58,"title":"ページング処理はどう実装しましたか？","category":"Java","starred":false,"answer":"ページングをゼロから設計した経験はありません。既存の一覧画面で、検索条件や表示項目を修正し、ページを切り替えても正しいデータが表示されるか確認しました。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":59,"title":"入力チェックはどこで行いましたか？","category":"Java","starred":false,"answer":"画面側ではJavaScriptやjQueryで未入力などを確認しました。また、サーバー側でも入力内容を確認するようにしました。画面側だけでなく、サーバー側でもチェックすることが大切だと考えています。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":60,"title":"一覧表示機能の実装経験はありますか？","category":"Java","starred":false,"answer":"はい、あります。予約一覧、配送一覧、在庫照会などの画面で、検索条件に合うデータをSQLで取得し、一覧に表示する処理を経験しました。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":"第4案件｜製造業Web"},{"id":61,"title":"ファイルアップロードの経験はありますか？","category":"Java","starred":false,"answer":"ファイルアップロード機能を新しく開発した経験はありません。ファイルやデータを扱う作業が必要な場合は、手順書や既存の仕組みを確認して対応します。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":""},{"id":62,"title":"バッチ処理やSpring Batchの経験はありますか？","category":"Java","starred":false,"answer":"Spring Batchを使った業務バッチの実装経験は、現時点では確認できていません。Web画面とDBの処理が中心です。必要であれば、処理の流れを学んで対応したいです。","followup":"バッチ処理とは何ですか？","followupAnswer":"画面操作とは別に、決められたタイミングや条件でデータをまとめて処理する仕組みです。","caseReference":""},{"id":63,"title":"APIを開発した経験はありますか？","category":"Java","starred":false,"answer":"第4プロジェクトでは、JavaのControllerとServiceを使ったWeb機能の開発経験があります。ただし、外部システム向けAPIを独立して設計・公開した経験があるかは未確認です。","followup":"Controllerは何をしますか？","followupAnswer":"画面やクライアントからのリクエストを受け取り、Serviceに処理を依頼して結果を返します。","caseReference":"第4案件｜製造業Web"},{"id":64,"title":"開発環境構築したことがございますか？どうやってされましたか？","category":"Java","starred":false,"answer":"開発環境は、現場の手順書を見ながら設定しました。分からない設定があれば、手順書やチームの人に確認して進めました。サーバー環境を一から構築した経験はありません。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":""},{"id":65,"title":"画面開発とバックエンド開発では、どちらが得意ですか？","category":"Java","starred":false,"answer":"どちらも経験がありますが、画面側の開発の方が比較的慣れています。JavaScriptやjQueryで入力チェックや画面の動きを作ってきました。バックエンドでは、JavaやSQLを使った処理も経験しています。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":66,"title":"例外処理では何に注意しましたか？","category":"Java","starred":false,"answer":"エラーが起きた時に、原因を確認できるようにログを残すことを意識しています。また、画面にはユーザーが分かりやすいメッセージを表示し、難しいエラー内容をそのまま見せないようにします。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":67,"title":"トランザクションについて説明してください。","category":"Java","starred":false,"answer":"トランザクションは、複数のデータベース処理をまとめて一つの処理として扱う仕組みです。途中でエラーが起きた場合は変更を取り消し、データが不正な状態にならないようにします。","followup":"どのプロジェクトで、どのように使いましたか？","followupAnswer":"第1プロジェクトではJavaとSpring MVCで予約機能を実装し、第2プロジェクトでは物流機能を改修しました。第4プロジェクトではSpringとMyBatisを使いました。","caseReference":"第4案件｜製造業Web"},{"id":68,"title":"どのデータベースを使用しましたか？","category":"SQL・DB","starred":false,"answer":"経歴書に記載している主なデータベースは、1つ目と4つ目の案件でMySQL、2つ目と3つ目の案件でOracleです。SQL Serverについては、案件ごとの担当内容を確認してから説明します。","followup":"その技術を使った具体的な作業を教えてください。","followupAnswer":"JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。","caseReference":"第2案件｜物流システム"},{"id":69,"title":"SQL文は得意ですか？どのようなコマンドを使えますか？","category":"SQL・DB","starred":false,"answer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用しました。SELECT、INSERT、UPDATEなどを使い、検索条件や更新結果を確認しました。複数テーブルを結合したSQLも扱いました。","followup":"SQLの結果はどう確認しましたか？","followupAnswer":"検索条件に合うデータが取得できるか確認し、更新前後のDBの値を比較します。","caseReference":"第2案件｜物流システム"},{"id":70,"title":"今まで最大で何テーブルを結合しましたか？","category":"SQL・DB","starred":false,"answer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用しました。JOINを使ったSQLの経験がありますが、最大の結合テーブル数は確認が必要です。","followup":"JOINする際に注意することは？","followupAnswer":"結合キーと条件を確認し、意図しない重複行や取得漏れがないかを見ます。","caseReference":"第2案件｜物流システム"},{"id":71,"title":"一番長いSQL文は何行くらいでしたか？","category":"SQL・DB","starred":false,"answer":"検索条件や結合処理を含むSQLを扱いましたが、最長の行数は正確に把握していません。SQLの長さより、取得結果が仕様どおりかを確認していました。","followup":"長いSQLはどう確認しますか？","followupAnswer":"条件を分けて確認し、少ないテストデータで結果を比較します。","caseReference":"第4案件｜製造業Web"},{"id":72,"title":"SQLのチューニング、パフォーマンス向上、最適化の経験はありますか？","category":"SQL・DB","starred":false,"answer":"本格的なSQLチューニングを主担当として行った経験はありません。第2・第4プロジェクトでは、検索条件やSQLの結果を確認する作業を経験しました。","followup":"性能が遅い場合は何を確認しますか？","followupAnswer":"まず件数や検索条件、実行時間を確認し、必要に応じてリーダーに相談します。","caseReference":"第4案件｜製造業Web"},{"id":73,"title":"テーブル設計の経験はありますか？","category":"SQL・DB","starred":false,"answer":"テーブルをゼロから設計した経験はありません。既存のテーブル定義書を見て、カラムやデータ型を確認し、SQLを使った検索・更新を行いました。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":"第4案件｜製造業Web"},{"id":74,"title":"論理削除と物理削除の違いを説明してください。","category":"SQL・DB","starred":false,"answer":"物理削除は、データをデータベースから削除することです。論理削除は、削除フラグなどを変更して、データ自体は残したまま通常の画面に表示しない方法です。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":75,"title":"MyBatis XMLで注意したことは何ですか？","category":"SQL・DB","starred":false,"answer":"MyBatisのXMLでは、SQLの条件やタグの書き方に注意しました。特に、検索条件を追加した時にSQLの構文エラーが起きないか確認しました。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第2案件｜物流システム"},{"id":76,"title":"DB作業で気をつけていることは何ですか？","category":"SQL・DB","starred":false,"answer":"UPDATEやDELETEを実行する前に、WHEREの条件をよく確認します。まずSELECTで対象のデータを確認し、間違ったデータを変更しないように気をつけています。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":77,"title":"内部結合（INNER JOIN）と外部結合（OUTER JOIN）の違いを説明してください。","category":"SQL・DB","starred":false,"answer":"INNER JOINは、結合条件に合うデータだけを取得します。LEFT JOINは、左側のテーブルのデータをすべて残し、相手のテーブルに合うデータがない場合はNULLになります。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":78,"title":"単体テストシナリオ、または単体テスト仕様書を作成した経験はありますか？","category":"テスト","starred":false,"answer":"はい。第4プロジェクトでは、詳細設計書を参考にして、受注登録や在庫照会などの機能の単体テスト項目を整理しました。正常系だけでなく、必須項目の未入力や条件違いも確認しました。","followup":"どのような観点で項目を作りましたか？","followupAnswer":"画面初期表示、入力チェック、登録・検索の正常系と異常系を確認できるようにしました。","caseReference":"第4案件｜製造業Web"},{"id":79,"title":"単体テストはどうやって行いましたか？","category":"テスト","starred":false,"answer":"第1プロジェクトでは、予約登録や重複チェックの動作を確認しました。第4プロジェクトでは、詳細設計書とテスト仕様書を見ながら画面を操作し、期待結果と実際の結果を比較しました。","followup":"エビデンスは何を残しますか？","followupAnswer":"画面キャプチャ、必要なDBの確認結果、エラー時のログなどを記録します。","caseReference":"第4案件｜製造業Web"},{"id":80,"title":"画面テストの経験はありますか？","category":"テスト","starred":false,"answer":"はい、あります。画面の表示、入力チェック、ボタンを押した時の動き、画面遷移などを確認しました。テスト結果は画面キャプチャなどで記録しました。","followup":"その経験がない場合、どのように対応しますか？","followupAnswer":"その工程は実務で担当したことがありませんが、まず仕様書や既存の資料を確認し、分からない点はリーダーに相談しながら進めたいです。","caseReference":"第4案件｜製造業Web"},{"id":81,"title":"JUnitの経験はありますか？","category":"テスト","starred":false,"answer":"JUnitの実務での使用範囲は、履歴書の記載だけでは明確ではありません。Javaの単体テストについては、画面や処理の動作確認を説明できます。JUnitのテストコードを自作したと断定しないようにしています。","followup":"JUnitでは何をしますか？","followupAnswer":"Javaのメソッドなどに対して、入力と期待結果を用意し、自動でテストするために使います。","caseReference":"第4案件｜製造業Web"},{"id":82,"title":"結合テストの経験はありますか？","category":"テスト","starred":false,"answer":"はい。第2・第3・第4プロジェクトで、結合テストの実施を担当しました。用意されたテスト仕様書をもとに、画面からDBまでの処理を確認しました。","followup":"不具合が出た場合は？","followupAnswer":"再現手順と期待結果・実際の結果を整理し、ログやデータを確認してリーダーに報告します。","caseReference":"第2案件｜物流システム"},{"id":83,"title":"テストデータは自分で準備しましたか？","category":"テスト","starred":false,"answer":"第4プロジェクトでは、テスト条件に合わせて必要なデータを確認しました。データが不足する場合は、テスト環境で準備方法を確認して対応します。","followup":"データの確認方法は？","followupAnswer":"SQLで対象レコードを検索し、テスト前後の値を比較します。","caseReference":"第4案件｜製造業Web"},{"id":84,"title":"テストで一番注意していることは何ですか？","category":"テスト","starred":false,"answer":"仕様書どおりに動くかを確認することと、入力ミスなどの時にも正しく動くかを確認することです。正常な場合だけでなく、エラーの場合もテストするようにしています。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":85,"title":"バグが発生したら、どうやって解決しますか？","category":"テスト","starred":false,"answer":"第1プロジェクトでは、予約の重複チェックや社内ITのトラブル対応を経験しました。まず再現条件とログを確認し、画面・プログラム・DB・環境のどこに原因があるか切り分けます。難しい場合はリーダーに相談します。","followup":"切り分けの順番は？","followupAnswer":"エラーメッセージ、再現条件、入力データ、ログ、DBの値、環境設定の順に確認します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":86,"title":"バグを減らすために心がけていることは何ですか？","category":"テスト","starred":false,"answer":"修正したコードを見直し、仕様書に沿って動作確認をします。また、修正した機能だけでなく、周りの機能に影響がないかも確認します。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":87,"title":"一番難しかった不具合は何ですか？","category":"テスト","starred":false,"answer":"特に難しかった不具合について、具体的な事例を一つ確認してから説明したいです。普段は、画面の動き、SQLの結果、ログを順番に確認し、原因を調べてから修正し、再テストしています。","followup":"その問題をどのように解決しましたか？","followupAnswer":"まず状況を整理し、仕様書やログ、ソースコードを確認しました。原因を切り分け、必要な修正と再テストを行いました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":88,"title":"1日に何件くらい不具合対応できますか？","category":"テスト","starred":false,"answer":"不具合の内容によって対応件数は変わります。表示や入力チェックの軽微な修正と、原因調査が必要な不具合では、かかる時間が異なります。","followup":"その数字の内訳を説明できますか？","followupAnswer":"再現条件と影響範囲を確認して、優先順位をリーダーに相談します。","caseReference":""},{"id":89,"title":"ホワイトボックステストとブラックボックステストの違いを説明してください。","category":"テスト","starred":false,"answer":"ホワイトボックステストは、プログラムの中の処理や条件分岐を確認するテストです。ブラックボックステストは、内部のコードを見ずに、入力に対して期待した結果になるかを確認するテストです。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":90,"title":"単体テストの観点漏れを防ぐために、何をしましたか？","category":"テスト","starred":false,"answer":"詳細設計書を読んで、正常な場合だけでなく、入力ミスやデータがない場合なども考えます。必要に応じてリーダーに確認し、テスト項目に漏れがないようにします。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":91,"title":"単体テストの完了条件は何ですか？","category":"テスト","starred":false,"answer":"テスト仕様書にある項目を実施し、期待した結果になることを確認したら完了です。不具合があった場合は修正後に再テストし、結果も記録します。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":92,"title":"単体テスト仕様書とエビデンスは、どのように対応づけましたか？","category":"テスト","starred":false,"answer":"テスト項目ごとに期待結果と実際の結果を確認することを意識しています。エビデンスの提出形式は、案件のルールに従います。","followup":"エビデンスは何のために必要ですか？","followupAnswer":"テストした内容と結果を、後から第三者が確認できるようにするためです。","caseReference":"第4案件｜製造業Web"},{"id":93,"title":"単体テスト仕様書は、1画面あたり何項目くらい作成しましたか？","category":"テスト","starred":false,"answer":"入力項目やチェック条件によって件数が変わります。正常系と異常系を分け、必須項目や境界値などを確認します。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":94,"title":"Gitでは、どのような操作ができますか？","category":"ツール","starred":false,"answer":"Gitでは、最新のソースを取得したり、変更をコミットしたりする基本操作を経験しました。作業前に最新のコードを確認し、変更したファイルに問題がないか確認してから共有していました。","followup":"そのツールをどの案件で使いましたか？","followupAnswer":"案件の開発環境やバージョン管理のルールに従って使用しました。具体的な操作範囲はツールごとに説明します。","caseReference":""},{"id":95,"title":"Mavenは何に使いましたか？","category":"ツール","starred":false,"answer":"Mavenは、 発経験はありますか？","answer":"SQLを使ったデータの取得や更新は経験があります。PL/SQLでの本格的な開発経験については、現時点ではありません。","followup":"どの案件のDBで確認しましたか？","category":"SQL・DB","starred":false,"followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":""},{"id":152,"title":"SQLの結果が正しいか、どう確認しましたか？","answer":"検索条件と取得したデータを確認します。必要に応じてテストデータを使い、想定した件数や内容と一致するかチェックします。","followup":"どの案件のDBで確認しましたか？","category":"SQL・DB","starred":false,"followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":""},{"id":153,"title":"QA対応では、どのような作業を行いましたか？","answer":"質問の内容を確認し、仕様書やコードを調べて回答する作業だと理解しています。経験のある作業範囲は具体的に説明します。","followup":"すぐに回答できない場合はどうしますか？","category":"保守","starred":false,"followupAnswer":"質問の内容を確認し、仕様書やコードを調べて回答する作業だと理解しています。経験のある作業範囲は具体的に説明します。","caseReference":""},{"id":154,"title":"詳細設計書のレビューでは、どのような指摘を受けましたか？","category":"設計","answer":"第3プロジェクトでは、銀行向けシステムの詳細設計書を修正しました。レビューでは、入力チェックの条件や検索条件の書き方などを確認してもらい、指摘があれば修正する流れで対応しました。","followup":"指摘内容をどのように修正しましたか？","followupAnswer":"指摘の理由を確認して設計書を修正し、必要に応じて再確認をお願いしました。","caseReference":"第3案件｜銀行システム","starred":false},{"id":155,"title":"レビューの指摘に対して、どのように対応しましたか？","category":"設計","answer":"まず指摘内容を読み、分からない点はリーダーに確認します。その後、詳細設計書を修正し、同じ問題が他の箇所にもないか確認します。第3プロジェクトの設計書修正でも、この流れを意識していました。","followup":"修正したあと、何を確認しますか？","followupAnswer":"指摘した内容が正しく反映されているか、関連する記載にも矛盾がないか確認します。","caseReference":"第3案件｜銀行システム","starred":false},{"id":156,"title":"UMLやクラス図を作成した経験はありますか？","category":"設計","answer":"Javaのクラス構成やController、Service、Mapperの役割は理解しています。ただし、業務でUMLやクラス図を自分で新規作成した経験については、実績としてはお伝えしていません。","followup":"クラス図では何を表しますか？","followupAnswer":"クラスの属性やメソッド、クラス同士の関係を図で表します。","caseReference":"","starred":false},{"id":157,"title":"1か月に何ステップぐらい製造しましたか？","category":"Java","answer":"第2プロジェクトでは既存の物流管理機能の改修を担当しました。コーディング量は作業内容によって変わるため、月間の正確な行数は把握していません。","followup":"新規開発と改修では同じですか？","followupAnswer":"いいえ。既存コードの調査やテストに時間がかかる改修では、行数だけで生産性を比較できないと思います。","caseReference":"第2案件｜物流システム","starred":false},{"id":158,"title":"1日に何ステップぐらいコーディングできますか？","category":"Java","answer":"1日のコーディング量は、仕様確認や既存コードの調査、テストの有無によって変わります。行数だけでなく、品質と動作確認を重視しています。","followup":"コードを書く以外にどんな作業がありますか？","followupAnswer":"既存コードの調査、仕様確認、動作確認、単体テスト、レビュー対応などがあります。","caseReference":"第2案件｜物流システム","starred":false},{"id":159,"title":"1週間で何画面ぐらい開発しましたか？","category":"Java","answer":"第1プロジェクトでは予約登録、変更、一覧検索などの画面に携わりました。1週間あたりの画面数は、機能の複雑さや改修範囲によって異なります。","followup":"どの画面の改修が難しかったですか？","followupAnswer":"予約の登録・変更画面です。同じ施設や時間に予約が重ならないか確認する処理があったためです。","caseReference":"第1案件｜自治体予約・IT運用","starred":false},{"id":160,"title":"今までで一番コーディング量が多かった案件はどれですか？","category":"Java","answer":"第4プロジェクトの製造業向けWebシステムを例に説明できます。受注管理や在庫管理の画面・処理を担当しました。ただし、案件別の正確なコード行数はまだ確認できていません。","followup":"どんな処理を実装しましたか？","followupAnswer":"受注情報の登録や在庫情報の検索など、画面からDBにつながる処理を担当しました。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":161,"title":"JavaScriptでどのようなイベント処理を実装しましたか？","category":"Java","answer":"第1プロジェクトでは、予約画面でJavaScriptとjQueryを使用しました。入力内容を確認する処理や、ボタン操作に合わせた画面のチェック処理を実装しました。","followup":"具体的にどんな入力チェックですか？","followupAnswer":"必須項目の未入力や日付の条件などを確認し、入力に問題があれば画面にメッセージを表示する処理です。","caseReference":"第1案件｜自治体予約・IT運用","starred":false},{"id":162,"title":"1画面あたりの入力項目数はどのぐらいでしたか？","category":"設計","answer":"第1プロジェクトでは、施設や予約日時などを入力する予約画面を担当しました。入力項目数は画面によって異なります。","followup":"どの項目に入力チェックが必要でしたか？","followupAnswer":"施設や日付、開始時間、終了時間などの必須項目と、時間の前後関係を確認する必要があります。","caseReference":"第1案件｜自治体予約・IT運用","starred":false},{"id":163,"title":"単体テスト仕様書は何を参考にして作成しましたか？","category":"テスト","answer":"第4プロジェクトでは、詳細設計書と既存のテスト仕様書を参考にしました。正常系だけでなく、必須項目が空の場合などの異常系も確認できるようにしました。","followup":"どんなテスト項目を作りましたか？","followupAnswer":"画面の初期表示、登録処理、検索条件、入力チェック、エラーメッセージなどです。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":164,"title":"単体テスト仕様書のレビューでは、どのような指摘を受けましたか？","category":"テスト","answer":"テスト項目の漏れや、正常系・異常系の不足がないかを確認することが重要だと考えています。実際に受けたレビュー指摘の内容は確認してお答えします。","followup":"指摘があったらどう対応しますか？","followupAnswer":"不足したテストパターンを追加し、期待結果も見直してから再確認します。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":165,"title":"JUnitのテストコードは自分で作成しましたか？","category":"テスト","answer":"第4プロジェクトでは単体テストを担当しました。ただし、JUnitのテストコードを自分でどの程度作成したかは、実績を確認してからお答えします。画面操作によるテストとJUnitによるテストは区別しています。","followup":"JUnitはどんなテストに使いますか？","followupAnswer":"Javaのメソッドなどの処理結果が期待どおりか、自動で確認する単体テストに使います。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":166,"title":"結合テスト仕様書を作成した経験はありますか？","category":"テスト","answer":"結合テストの実施経験はあります。第2プロジェクトでは物流管理機能の改修後に関連処理を確認しました。仕様書を新規作成した経験については、実際の担当範囲を確認してお答えします。","followup":"結合テストでは何を確認しますか？","followupAnswer":"画面と業務処理、DB更新など、複数の機能をつなげて期待どおりに動くか確認します。","caseReference":"第2案件｜物流システム","starred":false},{"id":167,"title":"テストケースが一番多かった時は、何項目ぐらいありましたか？","category":"テスト","answer":"第4プロジェクトでは正常系と異常系のテストを担当しました。テストケース数は機能によって異なり、最大件数は正確に把握していません。","followup":"どのような異常系を確認しましたか？","followupAnswer":"必須項目の未入力、入力形式の誤り、検索結果が0件の場合などです。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":168,"title":"自分でテーブルを作成した経験はありますか？","category":"SQL・DB","answer":"第4プロジェクトではMySQLを使用した検索・更新処理を担当しました。テーブルの新規設計・作成については、自分の担当範囲を確認してお答えします。","followup":"CREATE TABLEは使えますか？","followupAnswer":"SQLの基本的な構文は理解しています。業務で実行する場合は既存の設計や手順を確認します。","caseReference":"第4案件｜製造業Webシステム","starred":false},{"id":169,"title":"今まで扱ったデータ量は最大でどれぐらいでしたか？","category":"SQL・DB","answer":"第2プロジェクトではOracleで配送依頼のデータを扱い、第4プロジェクトではMySQLで受注・在庫情報を扱いました。ただし、最大レコード数は確認できていません。","followup":"データが多い場合は何に注意しますか？","followupAnswer":"検索条件、インデックスの有無、取得件数などを確認し、必要ならリーダーに相談します。","caseReference":"第2案件｜物流システム","starred":false},{"id":170,"title":"GitとSVNの違いを説明できますか？","category":"實務","answer":"はい。Gitは分散型のバージョン管理システムで、ローカルにも履歴を持てます。SVNは中央集中型で、主にサーバー側で履歴を管理します。","followup":"Gitではどんな操作を使いますか？","followupAnswer":"pull、commit、pushなどが基本的な操作です。現場の運用ルールに合わせて使います。","caseReference":"","starred":false},{"id":171,"title":"帳票出力機能を開発した経験はありますか？","category":"Java","answer":"これまでの4案件では、帳票出力を主な担当として開発した経験はありません。第4プロジェクトでは、受注や在庫の画面機能を担当しました。","followup":"帳票出力はどのような機能ですか？","followupAnswer":"システムのデータを、PDFやExcelなどの決まった形式で出力する機能です。","caseReference":"第4案件｜製造業Webシステム","starred":false}];

const INTRO=[{"title": "開場・自己紹介", "answer": "初めまして、鄭（テイ）と申します。本日はお時間をいただき、ありがとうございます。台湾出身で、来日5年目になります。ITエンジニアとして、約3年半の実務経験があります。主にJavaを使ったWebシステムの開発や、テスト、運用保守を経験してきました。", "hint": "台湾 / 来日5年目 / Java / 開発・テスト・保守"}, {"title": "案件紹介へのつなぎ", "answer": "それでは、職務経歴書に沿って、これまでの4つのプロジェクトについて、順番にご説明します。", "hint": "職務経歴書に沿って / 4つ / 順番に"}, {"title": "案件 1｜自治体向け予約管理＋社内IT", "answer": "まず、1つ目は、自治体向けの管理システム開発と、社内ITインフラの運用保守です。会議室や備品の予約を管理するWebシステムです。私はJavaとSpring MVCを使って、予約の登録、変更、取消、検索機能を担当しました。また、同じ時間に予約が重ならないように、チェック処理も実装しました。開発以外では、Windows ServerやNASの管理、ネットワークの運用保守も担当しました。", "hint": "予約 / Java・Spring MVC / 重複チェック / Windows Server・NAS"}, {"title": "案件 2｜物流管理システム改修", "answer": "2つ目は、物流会社向けの管理システム改修です。配送依頼や配送状況を管理するシステムです。私はJavaとSpringを使って、既存機能の修正を担当しました。特に、複数の配送依頼をまとめる機能を実装しました。データベースはOracleを使用し、MyBatisを使ったデータの取得や更新も行いました。また、単体テストと結合テストも担当しました。", "hint": "配送依頼統合 / Java・Spring / Oracle・MyBatis / テスト"}, {"title": "案件 3｜銀行向けシステム改修・保守", "answer": "3つ目は、銀行向けの管理システム改修です。融資の申し込みや、顧客情報などを管理するシステムです。私は主に、詳細設計書の修正と、画面や検索機能の修正を担当しました。また、単体テストと結合テストも行いました。開発が終わった後は、臨時保守として、ログの確認や不具合の調査も担当しました。", "hint": "詳細設計修正 / 画面・検索 / テスト / 臨時保守"}, {"title": "案件 4｜製造業向けWebシステム", "answer": "最後の4つ目は、製造業向けの管理Webシステム新規開発です。受注、発注、在庫、出荷などを管理するシステムです。私は詳細設計書の作成から、製造、単体テスト、結合テストまで担当しました。主にJavaとSpringを使って、受注登録や在庫照会、出荷指示をまとめる機能を開発しました。また、MyBatisとMySQLを使ったデータ処理や、Thymeleafを使った画面開発も経験しました。", "hint": "受注・在庫・出荷 / 詳細設計 / Java・Spring / MySQL・Thymeleaf"}, {"title": "締め", "answer": "以上が、これまでの主な業務経験です。今後もJavaの開発経験を活かしながら、新しい技術も勉強していきたいと思っています。以上です。よろしくお願いいたします。", "hint": "経験を活かす / 新しい技術 / よろしくお願いします"}];

const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const aliases={Java:'ジャバ',SQL:'データベース DB database',自己紹介:'自我介紹 自介',詳細設計:'設計書 design',単体テスト:'測試 unit test',結合テスト:'integration test',運用:'維運 保守',物流:'配送 送貨',銀行:'金融',製造業:'在庫 出荷 受注',自治体:'予約 會議室',障害:'不具合 バグ error',Spring:'スプリング'};

function data(){return qa}
function filtered(){let list=data();if(section==='favorites')list=list.filter(x=>x.starred);else if(section.startsWith('cat:'))list=list.filter(x=>x.category===section.slice(4));

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlight(s){let e=esc(s);if(!searchText.trim())return e;const terms=searchText.trim().split(/\s+/).filter(Boolean);for(let t of terms){let safe=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{e=e.replace(new RegExp('('+safe+')','ig'),'<mark>$1</mark>')}catch{}}return e}
function renderNav(){const groups=[['快速入口',[['intro','🎙 履歷介紹模式'],['all','☷ 全部正式題目'],['favorites','★ 收藏題目']]],['題目分類',categories.map(c=>['cat:'+c,c])]]; $('navigation').innerHTML=groups.map(([title,items])=>`<div class="navtitle">${title}</div>${items.map(([id,label])=>`<button class="nav ${section===id?'active':''}" data-nav="${esc(id)}"><span>${esc(label)}</span><span class="count">${id==='all'?qa.length:id==='candidates'?15:id==='favorites'?qa.filter(x=>x.starred).length:id.startsWith('cat:')?qa.filter(x=>x.category===id.slice(4)).length:''}</span></button>`).join('')}`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;searchText='';$('search').value='';selected=0;render();$('sidebar').classList.remove('open')})}
function btn(label,fn,extra=''){return `<button class="pill" onclick="${fn}" ${extra}>${label}</button>`}
function card(x,full=true){return `<article class="card" id="q-${x.id}"><span class="tag">${x.category==='候選題'?'待確認 · 候選題':esc(x.category)} · Q${x.id}</span>${x.caseReference?`<span class="tag" style="margin-left:6px;background:#eef8f2;color:#246346">${esc(x.caseReference)}</span>`:''}<div class="qtitle">${highlight(x.title)}</div>${full?`<div class="answer">${highlight(x.answer)}</div>`:''}${x.followup&&full?`<div class="follow"><b>可能的追問：</b><button class="follow-link" onclick="showFollowup(${x.id})">${esc(x.followup)} ↗</button></div>`:''}<div class="actions">${btn(x.starred?'★ 已收藏':'☆ 收藏',`star(${x.id})`)}${btn('複製答案',`copyAnswer(${x.id})`)}${!full?btn('查看回答',`openQuestion(${x.id})`):''}${x.category!=='候選題'?btn('✎ 編輯',`editQA(${x.id})`):''}${btn('單題查看',`openQuestion(${x.id})`)}</div></article>`}
function renderIntro(){let idx=selected%INTRO.length;const all=INTRO.map((x,i)=>`<div class="step card" style="border-left:4px solid ${i===idx?'#4868e8':'#e4e7ef'}"><span class="tag">${i+1} / ${INTRO.length}</span><h3>${esc(x.title)}</h3><div class="cue">記憶關鍵字：${esc(x.hint)}</div><div class="answer">${esc(x.answer)}</div><div class="actions">${btn('複製這段',`copyText(INTRO[${i}].answer)`)}${btn('✎ 編輯這段',`editIntro(${i})`)}${btn('只看這段',`jumpIntro(${i})`)}</div></div>`).join('');let x=INTRO[idx];$('content').innerHTML=`<div class="heading"><div><h1>🎙 看著履歷介紹案件</h1><p>依照履歷介紹：自我介紹 → 四個案件 → 結尾</p></div><span class="tag">約 4～5 分鐘</span></div><div class="notice">本模式是口說稿，不是履歷檔案預覽。請另外開啟你的職務経歴書，依照案件內容一起練習。</div><div class="toolbar"><button class="btn ${showFull?'active':''}" onclick="showFull=true;render()">完整連續滑動</button><button class="btn ${!showFull?'active':''}" onclick="showFull=false;render()">逐段練習</button>${btn('複製完整介紹',`copyText(INTRO.map(x=>x.answer).join('\\n\\n'))`)}</div>${showFull?all:`<div class="card"><span class="tag">${idx+1} / ${INTRO.length}</span><div class="progress"><div style="width:${(idx+1)/INTRO.length*100}%"></div></div><h2>${esc(x.title)}</h2><div class="cue">記憶關鍵字：${esc(x.hint)}</div><div class="answer">${esc(x.answer)}</div><div class="actions">${btn('← 上一段','jumpIntro('+Math.max(0,idx-1)+')')}${btn('下一段 →','jumpIntro('+Math.min(INTRO.length-1,idx+1)+')')}${btn('複製',`copyText(INTRO[${idx}].answer)`)}${btn('✎ 編輯這段',`editIntro(${idx})`)}</div></div>`}<div class="help">提示：在「逐段練習」時可用 ← → 切換段落。案件順序依本題庫的案件 1～4 排列。</div>`}
function renderQA(){let list=filtered();selected=Math.min(Math.max(0,selected),Math.max(0,list.length-1));let name=section==='favorites'?'收藏題目':section.startsWith('cat:')?section.slice(4):'全部正式題目';let head=`<div class="heading"><div><h1>${esc(name)}</h1><p>找到 ${list.length} 題 · ${mode==='list'?'可連續上下滑動':'單題專注閱讀'}</p></div><span class="tag">正式 ${qa.length} 題</span></div>`;if(!list.length){$('content').innerHTML=head+'<div class="card empty">沒有找到符合條件的題目。請試試其他關鍵字。</div>';return}if(mode==='list'){$('content').innerHTML=head+`<div class="toolbar">${btn('只顯示題目',`toggleListAnswers(false)`)}${btn('展開全部答案',`toggleListAnswers(true)`)}${btn('＋ 新增題目','newQA()')}</div>`+list.map(x=>card(x,showFull)).join('');return}let x=list[selected];let related=list.filter(y=>y.id!==x.id&&y.category===x.category).slice(0,7);$('content').innerHTML=head+`<div class="detail-layout"><div><div class="toolbar">${btn('← 上一題','move(-1)')}${btn('下一題 →','move(1)')}${btn('＋ 新增題目','newQA()')}<span class="tiny muted" style="align-self:center">${selected+1} / ${list.length}</span></div>${card(x,true)}<div class="help">快捷鍵：↑ ↓ 或 ← → 換題，Ctrl+K 搜尋，Esc 清除搜尋。</div></div><aside class="card related"><b>相關題目</b><p class="mini">相同分類的其他問題</p>${related.map(y=>`<button onclick="openQuestion(${y.id})">Q${y.id} · ${esc(y.title)}</button>`).join('')}</aside></div>`}

</script><div id="editOverlay" class="edit-overlay hidden" role="dialog" aria-modal="true" aria-label="編輯題目"><div class="edit-dialog"><div class="edit-head"><h2 id="editHeading">編輯</h2><button class="btn" onclick="closeEditor()">✕ 關閉</button></div><div class="edit-body"><label>題目／段落名稱<input id="editTitle" type="text"></label><label id="categoryWrap">分類<input id="editCategory" type="text" list="categoryOptions"><datalist id="categoryOptions"></datalist></label><label>答案（日文）<textarea id="editAnswer" rows="9"></textarea></label><label id="hintWrap">記憶關鍵字<input id="editHint" type="text"></label><label id="followWrap">可能的追問（選填）<textarea id="editFollow" rows="3"></textarea></label><label>追問的日文回答範例<textarea id="editFollowAnswer" rows="4"></textarea></label></div><div class="edit-foot"><button id="deleteEdit" class="btn danger" onclick="deleteEdited()">刪除題目</button><div style="flex:1"></div><button class="btn" onclick="closeEditor()">取消</button><button class="btn save" onclick="saveEdited()">儲存修改</button></div></div></div><div id="followOverlay" class="edit-overlay hidden" role="dialog" aria-modal="true" aria-label="追問導航"><div class="edit-dialog"><div class="edit-head"><h2>追問練習</h2><button class="btn" onclick="closeFollowup()">✕ 關閉</button></div><div style="padding:20px;display:grid;gap:14px"><small id="followSource" style="color:#64748b"></small><h3 id="followQuestion" style="font-size:20px;line-height:1.5"></h3><div style="font-weight:700">回答範例（日文）</div><button class="btn" id="followEditButton" onclick="editCurrentFollowup()" style="align-self:flex-start">✎ 編輯這題的追問與回答</button><div id="followAnswer" style="white-space:pre-wrap;line-height:1.85;background:#f2f6ff;border:1px solid #dbe5f5;border-radius:12px;padding:16px;font-size:17px"></div><div style="font-weight:700">相關題目（點一下跳轉）</div><div id="followLinks" style="display:flex;flex-wrap:wrap;gap:8px"></div><button class="btn" onclick="searchFollowup()">用追問全文搜尋</button></div></div></div><style>.follow-link{font:inherit;color:#3154ba;border:0;background:transparent;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}.follow-link:hover{color:#17318a}</style></body></html>
