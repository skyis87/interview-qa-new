<script type="application/json" id="oldDefaults">[{"id": 1, "answer": "鄭（テイ）と申します。台湾出身で、来日5年目になります。日本語能力試験N1に合格しています。\nITエンジニアとして約3年半の経験があります。これまで、自治体向けの施設予約システム、物流管理システム、銀行向けシステム、製造業向けWebシステムを経験しました。\n主にJava、JavaScript、SQLを使い、詳細設計、製造、単体テスト、結合テストを担当しました。また、社内サーバーやNASなどの運用保守も経験しています。\n分からないことは早めに確認し、チームと相談しながら仕事を進めることを大切にしています。本日はよろしくお願いいたします。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 2, "answer": "鄭（テイ）と申します。ITエンジニアとして約3年半の経験があります。\nJava、JavaScript、SQLを使ったWebシステム開発を経験し、詳細設計、製造、単体テスト、結合テストを担当しました。\nまた、社内サーバーやNASなどの運用保守も経験しています。これまでの経験を活かして、御社の仕事に貢献したいです。本日はよろしくお願いいたします。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "担当したのは、画面の入力チェック、検索・更新処理、テストなどです。案件によって担当範囲は異なりますが、主に詳細設計以降の作業を行いました。"}, {"id": 3, "answer": "これまで4つのプロジェクトを経験しました。\n1つ目は自治体向けの施設予約システムで、開発と社内ITインフラの運用保守を担当しました。\n2つ目は物流会社向けのシステムで、配送依頼をまとめる機能の開発とテストを担当しました。\n3つ目は銀行向けシステムで、詳細設計書の修正、テスト、臨時保守を担当しました。\n4つ目は製造業向けのWebシステムで、詳細設計、製造、単体テスト、結合テストを担当しています。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "担当したのは、画面の入力チェック、検索・更新処理、テストなどです。案件によって担当範囲は異なりますが、主に詳細設計以降の作業を行いました。"}, {"id": 4, "answer": "ITの実務経験は約3年半です。Webシステムの開発で、詳細設計書の修正や作成、プログラムの修正、単体テスト、結合テストを経験しました。また、問い合わせ調査や社内ITインフラの運用保守も経験しています。", "followup": "その期間で、主にどのような作業を担当しましたか？", "followupAnswer": "ITの実務経験は約3年半です。Webシステムの開発で、詳細設計書の修正や作成、プログラムの修正、単体テスト、結合テストを経験しました。また、問い合わせ調査や社内ITインフラの運用保守も経験しています。"}, {"id": 5, "answer": "プログラミングで何かを作ることに興味があったからです。自分が作ったシステムで仕事が便利になり、人の役に立てることにやりがいを感じています。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 6, "answer": "はい、対応できます。日本語能力試験N1に合格しています。まだ難しい説明に時間がかかることもありますが、仕事では報告・連絡・相談を大切にしています。分からないことは、そのままにせず確認します。", "followup": "具体的な経験を一つ教えていただけますか？", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 7, "answer": "私の強みは、分からないことを確認しながら、最後まで責任を持って作業することです。仕様書に疑問がある , "answer": "現在の選考状況については、営業担当に確認していただければと思います。", "followup": "その条件について、もう少し詳しく教えてください。", "followupAnswer": "現場のルールや作業内容を確認したうえで、リーダーと相談しながら対応したいと考えています。"}, {"id": 17, "answer": "今のところ、帰国の予定はありません。日本で長く働きながら、ITエンジニアとして経験を積んでいきたいです。", "followup": "その条件について、もう少し詳しく教えてください。", "followupAnswer": "現場のルールや作業内容を確認したうえで、リーダーと相談しながら対応したいと考えています。"}, {"id": 18, "answer": "自治体向けの施設予約システムの開発と、社内ITインフラの運用保守を担当しました。予約システムでは、JavaとSpring MVCを使って予約の登録、変更、取消、一覧検索などを実装しました。また、Windows ServerやNAS、FTPサーバーなどの管理や、社内PCの設定・トラブル対応も行いました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "主に会議室や備品の予約登録、変更、キャンセル機能を担当しました。また、予約が重複しないようにチェックする処理も実装しました。"}, {"id": 19, "answer": "JavaとSpring MVCを使って、予約の登録、変更、取消機能を修正・開発しました。画面側ではJavaScriptやjQueryで入力チェックを行い、SQLで予約情報を検索・更新しました。同じ施設と時間に予約が重ならないよう、既存の予約を確認する処理も作りました。", "followup": "実際の案件での具体例を教えてください。", "followupAnswer": "例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。"}, {"id": 20, "answer": "難しかったのは、同じ施設と時間に予約が重ならないようにすることです。予約日や施設、備品の組み合わせを確認する必要がありました。正常な入力だけでなく、必須項目が空の場合や過去の日付の場合もテストしました。", "followup": "その問題をどのように解決しましたか？", "followupAnswer": "まず状況を整理し、仕様書やログ、ソースコードを確認しました。原因を切り分け、必要な修正と再テストを行いました。"}, {"id": 21, "answer": "物流会社向けの管理システム改修です。配送依頼の登録や変更、取消、配送状況の検索機能を修正しました。また、配送日や配送先などの条件が同じ依頼をまとめる機能を開発し、単体テストと結合テストも担当しました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。"}, {"id": 22, "answer": "配送日、配送先、配送区分などを確認して、条件が同じ配送依頼をまとめる機能です。Java、MyBatis、Oracleを使い、対象データの検索や更新、一覧表示の処理を修正しました。テストでは、対象がある場合とない場合、複数件をまとめる場合などを確認しました。", "followup": "その中で、ご自身が担当した機能は何ですか？", "followupAnswer": "配送依頼の登録・変更や、同じ条件の配送依頼をまとめる機能を担当しました。JavaとSQLを使って、検索・更新処理を修正しました。"}, {"id": 23, "answer": "Oracleは、配送依頼のデータを検索・更新するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎ、必要なデータを取得したり、更新したりしました。既存のSQLを確認しながら、必要な修正を行いました。", "followup": "その技術を使った具体的な作業を教えてください。", "followupAnswer": "JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。"}, {"id": 24, "answer": "銀行向けの管理システム改修です。融資の申込みや審査状況、顧客情報 まにせず確認します。","followup":"日本語で分からない指示があったらどうしますか？","followupAnswer":"まず自分の理解を短く説明し、認識が合っているか確認します。必要であればメモを取って、後で見直します。","caseReference":""},{"id":7,"title":"ご自身の強みを教えてください。","category":"自己紹介","starred":false,"answer":"私の強みは、分からないことを確認しながら、最後まで責任を持って作業することです。仕様書に疑問がある時は、自分だけで判断せず、リーダーやチームの人に確認します。また、開発だけでなく、サーバーやNASの運用保守も経験しています。","followup":"その強みを発揮した経験はありますか？","followupAnswer":"仕様が分かりにくい場合、関連する設計書と既存コードを調べて疑問点を整理し、リーダーに確認してから修正しました。","caseReference":""},{"id":8,"title":"弱み、または改善している点を教えてください。","category":"自己紹介","starred":false,"answer":"弱みは、難しい内容を日本語で説明する時に、少し時間がかかることです。改善するために、話す前に要点を整理し、短く分かりやすく伝えるようにしています。分からない言葉があれば、確認するようにしています。","followup":"弱みを改善するために、普段何をしていますか？","followupAnswer":"面談で使うIT用語や作業説明を短い日本語でまとめ、声に出して練習しています。","caseReference":""},{"id":9,"title":"得意な技術は何ですか？","category":"自己紹介","starred":false,"answer":"Java、Spring、MyBatis、JavaScript、jQuery、SQLを使った経験があります。特に、画面の入力チェックや一覧表示、データベースの検索・更新処理を経験してきました。","followup":"その中で一番得意な技術は何ですか？","followupAnswer":"Javaです。画面からのリクエストを受け取り、検索・更新処理につなぐ開発を経験しました。","caseReference":""},{"id":10,"title":"担当したフェーズ、作業工程、担当範囲を教えてください。","category":"自己紹介","starred":false,"answer":"主に詳細設計、製造、単体テスト、結合テストを担当しました。案件によっては、問い合わせ調査や不具合の修正、臨時保守も経験しています。","followup":"基本設計の経験はありますか？","followupAnswer":"基本設計を主担当として作成した経験はありません。第3案件で詳細設計書の修正、第4案件で詳細設計書の作成を担当しました。","caseReference":""},{"id":11,"title":"一番得意な工程は何ですか？","category":"自己紹介","starred":false,"answer":"製造と単体テストが得意です。詳細設計書を確認しながらプログラムを修正し、仕様どおりに動くかテストしてきました。SQLを使ってデータを確認することもあります。","followup":"単体テストでは何を確認しましたか？","followupAnswer":"正常系と異常系を分けて、入力チェック、画面表示、DBの登録・更新結果を確認しました。","caseReference":""},{"id":12,"title":"今後どのような案件で成長したいですか？","category":"自己紹介","starred":false,"answer":"これからもJavaを使った開発の経験を増やしたいです。また、基本設計など、今までより上流の仕事にも少しずつ挑戦したいです。日本語での説明力も伸ばしていきたいです。","followup":"基本設計に挑戦するために何を勉強していますか？","followupAnswer":"画面遷移や業務フローを理解し、既存の基本設計書と詳細設計書のつながりを確認しています。","caseReference":""},{"id":13,"title":"直近の現場が終了する理由を教えてください。","category":"稼働・条件","starred":false,"answer":"現在の契約期間が終わるためです。これまでの経験を活かして、次のプロジェクトでも開発やテストの仕事を続けたいと考えています。","followup":"次の現場では何を希望しますか？","followupAnswer":"Javaを使ったWebシステムの開発を希望しています。詳細設計からテストまでの経験を活かしたいです。","caseReference":""},{"id":14,"title":"フル常駐は可能ですか？","category":"稼働・条件","starred":false,"answer":"はい、可能です。出社して仕事をすることに問題はありません。現場のルールを確認し、チームと相談しながら仕事を進めます。","followup":"出社頻度について希望はありますか？","followupAnswer":"フル常駐でも問題ありません。現場の勤務ルールに合わせて対応します。","caseReference":""},{"id":15,"title":"残業はどのくらい可能ですか？","category":"稼働・条件","starred":false,"answer":"残業については、案件の状況に合わせて相談しながら対応できます。忙しい時は、作業の進み具合や終わる見込みを早めに報告します。","followup":"残業が必要な場合、どのように対応しますか？","followupAnswer":"まず作業内容と期限を確認し、対応できる時間をリーダーに伝えます。無理のないように進捗も早めに共有します。","caseReference":""},{"id":16,"title":"現在の並行状況はいかがですか？","category":"稼働・条件","starred":false,"answer":"現在の選考状況については、営業担当に確認していただければと思います。","followup":"ほかの選考と日程が重なった場合はどうしますか？","followupAnswer":"日程や回答期限について、営業担当を通して早めに調整します。","caseReference":""},{"id":17,"title":"帰国予定はありますか？","category":"稼働・条件","starred":false,"answer":"今のところ、帰国の予定はありません。日本で長く働きながら、ITエンジニアとして経験を積んでいきたいです。","followup":"今後も日本で働き続けたいですか？","followupAnswer":"はい。日本で長く働き、Javaの開発経験を積みながら、将来は設計の仕事にも挑戦したいです。","caseReference":""},{"id":18,"title":"第1プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"自治体向けの施設予約システムの開発と、社内ITインフラの運用保守を担当しました。予約システムでは、JavaとSpring MVCを使って予約の登録、変更、取消、一覧検索などを実装しました。また、Windows ServerやNAS、FTPサーバーなどの管理や、社内PCの設定・トラブル対応も行いました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"予約の登録・変更・取消と重複チェックを担当しました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":19,"title":"第1プロジェクトでは、予約登録や変更機能をどのように改修しましたか？","category":"プロジェクト","starred":false,"answer":"JavaとSpring MVCを使って、予約の登録、変更、取消機能を修正・開発しました。画面側ではJavaScriptやjQueryで入力チェックを行い、SQLで予約情報を検索・更新しました。同じ施設と時間に予約が重ならないよう、既存の予約を確認する処理も作りました。","followup":"予約の重複はどのように確認しましたか？","followupAnswer":"施設と予約日時を条件に既存の予約を検索し、時間が重なる予約がある場合は登録できないようにしました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":20,"title":"第1プロジェクトで苦労した点は何ですか？","category":"プロジェクト","starred":false,"answer":"難しかったのは、同じ施設と時間に予約が重ならないようにすることです。予約日や施設、備品の組み合わせを確認する必要がありました。正常な入力だけでなく、必須項目が空の場合や過去の日付の場合もテストしました。","followup":"その問題をどのように解決しましたか？","followupAnswer":"施設と予約時間の条件を整理し、既存予約との重複チェックを実装しました。修正後は重複する場合としない場合をテストしました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":21,"title":"第2プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"物流会社向けの管理システム改修です。配送依頼の登録や変更、取消、配送状況の検索機能を修正しました。また、配送日や配送先などの条件が同じ依頼をまとめる機能を開発し、単体テストと結合テストも担当しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"配送依頼の登録・変更と、条件が同じ依頼をまとめる処理を担当しました。","caseReference":"第2案件｜物流システム"},{"id":22,"title":"第2プロジェクトの配送依頼統合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"配送日、配送先、配送区分などを確認して、条件が同じ配送依頼をまとめる機能です。Java、MyBatis、Oracleを使い、対象データの検索や更新、一覧表示の処理を修正しました。テストでは、対象がある場合とない場合、複数件をまとめる場合などを確認しました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"配送日や配送先を条件に対象データを取得し、統合後の更新処理を修正しました。","caseReference":"第2案件｜物流システム"},{"id":23,"title":"第2プロジェクトでは、OracleとMyBatisをどのように使いましたか？","category":"プロジェクト","starred":false,"answer":"Oracleは、配送依頼のデータを検索・更新するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎ、必要なデータを取得したり、更新したりしました。既存のSQLを確認しながら、必要な修正を行いました。","followup":"MyBatisのMapperでは何を修正しましたか？","followupAnswer":"配送依頼を取得するSQLの検索条件や、更新対象の条件を確認・修正しました。","caseReference":"第2案件｜物流システム"},{"id":24,"title":"第3プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"銀行向けの管理システム改修です。融資の申込みや審査状況、顧客情報、口座情報を扱うシステムでした。私は詳細設計書の修正、画面や検索条件の修正、単体テスト、結合テストを担当しました。開発終了後は、問い合わせ調査などの臨時保守も行いました。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"顧客検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。","caseReference":"第3案件｜銀行システム"},{"id":25,"title":"第3プロジェクトの顧客・口座情報の照合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"顧客情報と口座情報を確認する機能です。既存の設計書やソース、SQLを確認し、検索条件や重複候補の確認方法を整理しました。変更した内容が正しく動くか、単体テストや結合テストで確認しました。","followup":"検索条件を修正する時、何に注意しましたか？","followupAnswer":"既存の検索条件と変更内容を比較し、必要なデータが取得できるか、ほかの検索条件に影響がないか確認しました。","caseReference":"第3案件｜銀行システム"},{"id":26,"title":"第3プロジェクトの権限制御について説明してください。","category":"プロジェクト","starred":false,"answer":"権限制御を主な担当として開発した経験はありません。第3プロジェクトでは、銀行向けシステムの画面項目や検索条件の修正を担当しました。","followup":"権限制御を担当していない場合、何を担当しましたか？","followupAnswer":"顧客情報の検索条件や画面項目の修正、詳細設計書の変更、テストを担当しました。","caseReference":"第3案件｜銀行システム"},{"id":27,"title":"第3プロジェクトの臨時保守やログ調査について説明してください。","category":"プロジェクト","starred":false,"answer":"銀行向けシステムの開発が終わった後、問い合わせ調査や軽い不具合の修正、データ確認の依頼に対応しました。Linuxのログや既存のShellスクリプトを確認して、原因調査を手伝いました。分からない点はリーダーに報告して確認しました。","followup":"ログ調査では何を確認しましたか？","followupAnswer":"エラーが発生した時間帯とメッセージを確認し、関連する処理やデータを調べました。結果はリーダーに報告しました。","caseReference":"第3案件｜銀行システム"},{"id":28,"title":"第4プロジェクトを紹介してください。","category":"プロジェクト","starred":false,"answer":"製造業向けの管理Webシステムの新規開発です。受注、発注、在庫、出荷の業務を管理するシステムです。私は詳細設計書の作成、Javaでの製造、単体テスト、結合テストを担当しています。","followup":"その中で、ご自身が担当した機能は何ですか？","followupAnswer":"受注登録、在庫照会、出荷指示に関する機能を担当しました。","caseReference":"第4案件｜製造業Web"},{"id":29,"title":"第4プロジェクトの出荷指示統合機能について説明してください。","category":"プロジェクト","starred":false,"answer":"複数の受注を出荷単位にまとめる機能です。詳細設計書では、まとめる条件、在庫の確認、在庫が足りない時のエラー、まとめた後のデータ更新などを整理しました。その後、Javaで実装し、テストを行いました。","followup":"在庫が足りない場合はどうしましたか？","followupAnswer":"在庫不足の場合に処理を進めないよう、エラー条件と画面に表示する内容を設計書で確認しました。","caseReference":"第4案件｜製造業Web"},{"id":30,"title":"第4プロジェクトの受注登録や在庫照会機能について説明してください。","category":"プロジェクト","starred":false,"answer":"受注登録では、入力された内容を確認して登録する処理を作りました。在庫照会では、条件に合う在庫データを検索して画面に表示します。在庫が足りない場合や入力に問題がある場合も、正しく処理されるか確認しました。","followup":"受注登録ではどのような入力チェックをしましたか？","followupAnswer":"必須項目や数量などの入力内容を確認し、問題がある場合にエラーを表示する処理を扱いました。","caseReference":"第4案件｜製造業Web"},{"id":31,"title":"第4プロジェクトでThymeleafやMySQLをどのように使いましたか？","category":"プロジェクト","starred":false,"answer":"Thymeleafは、サーバーから受け取ったデータを画面に表示するために使いました。MySQLは、受注や在庫などのデータを保存・検索するために使いました。MyBatisを使ってSQLとJavaの処理をつなぎました。","followup":"Thymeleafでどのようにデータを表示しましたか？","followupAnswer":"Controllerから渡されたデータをHTMLの画面項目や一覧に表示しました。","caseReference":"第4案件｜製造業Web"},{"id":32,"title":"4つの案件の中で一番自信がある案件はどれですか？","category":"プロジェクト","starred":false,"answer":"一番自信があるのは、4つ目の製造業向けWebシステムです。詳細設計書の作成からJavaの製造、単体テスト、結合テストまで経験しました。特に、受注や在庫、出荷に関する機能を通して、画面からデータベースまでの流れを学びました。","followup":"第4案件で担当した処理を一つ説明してください。","followupAnswer":"受注登録では、入力内容をチェックし、問題がなければJavaの処理からMyBatisを使ってDBに登録しました。","caseReference":"第4案件｜製造業Web"},{"id":33,"title":"案件ごとの成長を説明してください。","category":"プロジェクト","starred":false,"answer":"1つ目の案件では、Javaでの画面機能の開発と社内ITの運用保守を経験しました。2つ目では、配送依頼をまとめる機能とテストを経験しました。3つ目では、詳細設計書の修正や臨時保守を経験しました。4つ目では、詳細設計書の作成から製造、テストまで経験し、できる仕事の範囲が広がりました。","followup":"特に成長したと感じる点は何ですか？","followupAnswer":"第3案件では既存設計書の修正が中心でしたが、第4案件では担当機能の詳細設計書を新規に作成するようになりました。","caseReference":""},{"id":34,"title":"詳細設計の経験はありますか？","category":"設計","starred":false,"answer":"はい、あります。第4プロジェクトの製造業向けWebシステムでは、受注登録や在庫照会などの機能について、詳細設計書の作成・修正を担当しました。第3プロジェクトでは、銀行向けシステムの既存設計書を修正しました。基本設計は担当していません。","followup":"具体的に何を記載しましたか？","followupAnswer":"第4プロジェクトでは、画面項目、入力チェック、ボタン操作時の処理、データ取得条件などを整理しました。","caseReference":"第4案件｜製造業Web"},{"id":35,"title":"詳細設計書はどうやって書きましたか？","category":"設計","starred":false,"answer":"第4プロジェクトでは、基本設計書や既存の設計書を確認し、画面ごとに詳細設計書を作成しました。画面項目や処理の流れ、SQLの取得条件を整理し、リーダーのレビュー後に指摘を修正しました。","followup":"何を参考にしましたか？","followupAnswer":"基本設計書、既存画面の詳細設計書、関連するソースコードを参考にしました。分からない点はリーダーに確認しました。","caseReference":"第4案件｜製造業Web"},{"id":36,"title":"基本設計と詳細設計の違いを教えてください。","category":"設計","starred":false,"answer":"基本設計は、システムで何をするかを整理するものです。\n例えば、画面の概要や画面遷移、業務のルールなどを書きます。\n詳細設計は、それをもとに、プログラムを作れるように処理の流れや入力チェック、\nDBの検索・更新内容などを詳しく書くものです。","followup":"どの案件で詳細設計を経験しましたか？","followupAnswer":"第3プロジェクトでは既存の詳細設計書を修正し、第4プロジェクトでは受注登録や在庫照会の詳細設計書を作成しました。","caseReference":""},{"id":37,"title":"詳細設計書の中には、どのような内容を書きましたか？","category":"設計","starred":true,"answer":"第4プロジェクトでは、画面レイアウト、項目定義、入力チェック、ボタンなどのイベント処理、DBからのデータ取得・更新処理を記載しました。特に項目定義と処理内容を確認しました。","followup":"画面項目定義には何を書きましたか？","followupAnswer":"項目名、入力形式、必須かどうか、文字数制限、表示内容、データの取得元などを整理しました。","caseReference":"第4案件｜製造業Web"},{"id":38,"title":"詳細設計書を何本くらい作成・修正しましたか？新規と改修の内訳も教えてください。","category":"設計","starred":true,"answer":"詳細設計書は、合計で9本ほど担当しました。\n第3プロジェクトの銀行向けシステムでは、既存の詳細設計書を4本ほど修正しました。主に検索条件や画面の処理内容を修正しました。\n第4プロジェクトの製造業向けWebシステムでは、新規で5本ほど作成しました。主に受注管理や在庫管理に関する画面の詳細設計を担当しました。","followup":"1本は何を数えていますか？","followupAnswer":"画面や機能ごとに作成・修正した詳細設計書を、1本として数えています。","caseReference":"第3案件｜銀行システム"},{"id":39,"title":"なぜ詳細設計書を改修しましたか？","category":"設計","starred":false,"answer":"第3プロジェクトでは、検索条件や画面項目の仕様変更に合わせて、\n詳細設計書を修正しました。修正後は実装内容と設計書にずれがないか確認しました。","followup":"仕様変更があった場合、最初に何をしますか？","followupAnswer":"変更内容と影響する画面や処理を確認し、不明点をリーダーに相談してから設計書を修正します。","caseReference":"第3案件｜銀行システム"},{"id":40,"title":"詳細設計書は誰がレビューしましたか？どのように進めましたか？","category":"設計","starred":false,"answer":"詳細設計書は、主にリーダーや経験のあるメンバーにレビューしてもらいました。\n指摘があった場合は、内容を確認して修正し、もう一度確認してもらいました。","followup":"どのような指摘を受けましたか？","followupAnswer":"入力チェックの条件が分かりにくいという指摘がありました。条件を具体的に書き直し、リーダーに再確認してもらいました。","caseReference":"第3案件｜銀行システム"},{"id":41,"title":"詳細設計書を書く時に難しかったことは何ですか？","category":"設計","starred":false,"answer":"第4プロジェクトでは、在庫が不足した場合など、\n正常時以外の処理を整理することが難しい点でした。\n設計書と既存の処理を確認し、判断できない条件はリーダーに相談しました。","followup":"どのように解決しましたか？","followupAnswer":"正常系と在庫不足などの異常系を分けて処理条件を整理し、判断できない点をリーダーに確認しました。","caseReference":"第4案件｜製造業Web"},{"id":42,"title":"1本の詳細設計書を作成するには、どれくらい時間がかかりますか？","category":"設計","starred":true,"answer":"画面や機能の複雑さによりますが、一般的な画面であれば、1本あたり2～3日程度です。\n処理が複雑な場合は、もう少し時間がかかります。","followup":"時間が足りない場合はどうしますか？","followupAnswer":"残作業と期限を整理して早めにリーダーへ報告し、優先順位を確認します。","caseReference":"第4案件｜製造業Web"},{"id":43,"title":"他人の設計書をレビューした経験はありますか？レビュアーの経験はありますか？","category":"設計","starred":false,"answer":"他の人の設計書を正式にレビューする担当は経験していません。\n自分が作成した設計書について、リーダーから指摘を受けて修正した経験はあります。","followup":"今後レビューを担当するなら何を確認しますか？","followupAnswer":"仕様との一致、入力チェックの漏れ、異常系の処理、ほかの機能への影響を確認します。","caseReference":""},{"id":44,"title":"要件定義の経験はありますか？","category":"設計","starred":false,"answer":"要件定義を担当した経験はありません。\nこれまでは、決められた要件や基本設計書を確認して、詳細設計、製造、テストを行ってきました。","followup":"要件定義の内容はどのように理解しましたか？","followupAnswer":"基本設計書や業務フローを確認し、不明点はリーダーに質問して担当機能の仕様を理解しました。","caseReference":""},{"id":45,"title":"基本設計の経験はありますか？","category":"設計","starred":false,"answer":"基本設計を主担当として行った経験はありません。\n主に詳細設計、製造、単体テスト、結合テストを担当しました。\n基本設計書を参考にして詳細設計を進めた経験はあります。","followup":"基本設計書は読めますか？","followupAnswer":"はい。画面や機能の仕様を確認するために参照しました。ただし、基本設計書そのものを作成した経験はありません。","caseReference":""},{"id":46,"title":"DB設計の経験はありますか？","category":"設計","starred":false,"answer":"テーブルをゼロから設計した経験はありません。\n既存のテーブル定義書を確認し、SQLでデータを検索・更新したり、\nテスト前後のデータを確認したりしました。","followup":"テーブル定義書では何を確認しましたか？","followupAnswer":"カラム名、データ型、主キー、検索に使う項目などを確認しました。","caseReference":""},{"id":47,"title":"製造経験について説明してください。","category":"Java","starred":false,"answer":"第1プロジェクトではJavaとSpring MVCで予約管理機能を開発しました。第2プロジェクトでは物流システムの既存機能を修正し、第4プロジェクトでは受注・在庫・出荷関連の機能をJavaで実装しました。","followup":"具体的にどのような処理を作りましたか？","followupAnswer":"第1プロジェクトでは、予約日時や施設を確認して、重複予約を防ぐチェック処理を実装しました。","caseReference":"第4案件｜製造業Web"},{"id":48,"title":"既存コードや現行コードを見て、改修・追加開発できますか？","category":"Java","starred":false,"answer":"はい、できます。第2プロジェクトでは、物流管理システムの既存コードを確認し、配送依頼の検索・更新処理を修正しました。修正前に影響する処理を確認し、修正後にテストしました。","followup":"既存コードを理解する手順は？","followupAnswer":"まず仕様書と処理の入口を確認し、ControllerからService、Mapperまで処理を追います。","caseReference":"第2案件｜物流システム"},{"id":49,"title":"システムを0から設計・製造した経験はありますか？","category":"Java","starred":false,"answer":"基本設計からシステム全体をゼロから作った経験はありません。第4プロジェクトでは、既存資料や基本設計書をもとに、担当機能の詳細設計と製造を行いました。","followup":"資料がない場合はどうしますか？","followupAnswer":"要件や期待する動作をリーダーに確認し、似た機能や既存コードを調べてから進めます。","caseReference":"第4案件｜製造業Web"},{"id":50,"title":"Controller、Service、Mapperの役割を説明してください。","category":"Java","starred":true,"answer":"Controllerは画面などからのリクエストを受け取ります。Serviceは業務の処理を行います。MapperはSQLを使ってデータベースにアクセスします。役割を分けることで、コードを整理しやすくなります。","followup":"第4プロジェクトではどのように使いましたか？","followupAnswer":"画面からのリクエストをControllerで受け取り、Serviceで処理し、MapperからMySQLのデータを検索・更新する構成でした。","caseReference":"第4案件｜製造業Web"},{"id":51,"title":"MVCについて説明してください。","category":"Java","starred":false,"answer":"MVCは、画面、処理、データを分けて作る考え方です。Viewは画面、Controllerはリクエストの受付、Modelはデータや処理を担当します。役割を分けることで、修正しやすくなります。","followup":"第4プロジェクトのViewには何を使いましたか？","followupAnswer":"第4プロジェクトではThymeleafを使い、サーバーから渡されたデータをHTML画面に表示しました。","caseReference":"第4案件｜製造業Web"},{"id":52,"title":"Spring Bootを使った経験を説明してください。","category":"Java","starred":false,"answer":"第4プロジェクトでは、JavaとSpringを使って受注登録や在庫照会などの機能を開発しました。Controllerでリクエストを受け取り、Serviceで業務処理を行い、MyBatisでDBの検索・更新処理を実装しました。なお、Spring Bootは学習でも使用しています。","followup":"Spring Bootはどこで使いましたか？","followupAnswer":"学習でSpring BootとMyBatisを使い、ログイン機能を作成しました。実務の第4プロジェクトではSpringを使用しました。","caseReference":"第4案件｜製造業Web"},{"id":53,"title":"Spring MVCとSpring Bootの違いを説明してください。","category":"Java","starred":true,"answer":"Spring MVCは、Web画面やリクエストを処理するための仕組みです。\nSpring Bootは、開発に必要な設定を簡単にして、アプリケーションを始めやすくする仕組みです。\nSpring Bootでは、設定を少なくして開発を進められます。","followup":"Spring MVCとSpring Bootは一緒に使えますか？","followupAnswer":"はい。Spring Bootで作ったアプリケーションでも、Spring MVCを使ってWebのリクエストを処理できます。","caseReference":"第4案件｜製造業Web"},{"id":54,"title":"MyBatisを使った経験を説明してください。","category":"Java","starred":true,"answer":"第2プロジェクトでは、Oracleの配送依頼データを扱うためにMyBatisを使用しました。\nMapperのSQLで検索・更新し、Java側から呼び出す処理を確認・修正しました。\n第4プロジェクトでもMyBatisとMySQLを使用しました。","followup":"Mapperでは何を確認しましたか？","followupAnswer":"SQLの検索条件、パラメータ、取得結果の対応、更新対象が正しいかを確認しました。","caseReference":"第2案件｜物流システム"},{"id":55,"title":"JSPとThymeleafの違いを説明してください。","category":"Java","starred":false,"answer":"JSPもThymeleafも、サーバー側のデータをHTML画面に表示するための技術です。JSPはJavaのWebアプリケーションで使う画面技術です。ThymeleafはHTMLの属性を使って値を表示するので、HTMLの構造を保ったまま書きやすいです。第4プロジェクトではThymeleafを使いました。","followup":"第4プロジェクトではどちらを使いましたか？","followupAnswer":"第4プロジェクトではThymeleafを使いました。サーバーから受け取ったデータを画面に表示するために使用しました。","caseReference":"第4案件｜製造業Web"},{"id":56,"title":"JavaScript、jQuery、Ajaxの経験を説明してください。","category":"Java","starred":false,"answer":"実務ではJavaScriptとjQueryを使い、予約画面の入力チェックやボタン操作などを実装しました。また、学習ではAjaxを使い、画面を再読み込みせずにサーバーと通信する処理を作成しました。","followup":"Ajaxではどのような処理を作りましたか？","followupAnswer":"学習でログイン画面から入力内容を非同期で送信し、サーバーから返った結果に応じて画面を切り替える処理を作成しました。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":57,"title":"JSONとは何ですか？どこで使いましたか？","category":"Java","starred":false,"answer":"JSONは、キーと値の組み合わせでデータを表す形式です。JavaScriptとサーバーの間でデータをやり取りするときによく使います。学習では、Spring Bootのログイン機能で、JSON形式のリクエストとレスポンスを扱いました。","followup":"JSONを使った具体例を教えてください。","followupAnswer":"学習で、ログイン画面からアカウント情報をJSON形式で送信し、サーバー側で受け取って処理する機能を作成しました。","caseReference":""},{"id":58,"title":"ページング処理はどう実装しましたか？","category":"Java","starred":false,"answer":"ページングをゼロから設計した経験はありません。既存の一覧画面で、検索条件や表示項目を修正し、ページを切り替えても正しいデータが表示されるか確認しました。","followup":"ページを切り替えた時は何を確認しましたか？","followupAnswer":"検索条件を保ったまま正しいデータが表示されるか、同じデータが重複して表示されないかを確認しました。","caseReference":"第4案件｜製造業Web"},{"id":59,"title":"入力チェックはどこで行いましたか？","category":"Java","starred":false,"answer":"画面側ではJavaScriptやjQueryで未入力などを確認しました。また、サーバー側でも入力内容を確認するようにしました。画面側だけでなく、サーバー側でもチェックすることが大切だと考えています。","followup":"なぜサーバー側でもチェックが必要ですか？","followupAnswer":"画面側のチェックだけでは、不正なリクエストを防げない場合があるためです。サーバー側でも入力値を確認します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":60,"title":"一覧表示機能の実装経験はありますか？","category":"Java","starred":false,"answer":"はい、あります。予約一覧、配送一覧、在庫照会などの画面で、検索条件に合うデータをSQLで取得し、一覧に表示する処理を経験しました。","followup":"一覧表示では具体的に何を担当しましたか？","followupAnswer":"検索条件をSQLに反映し、取得したデータを画面に表示する処理や、検索結果の確認を担当しました。","caseReference":"第4案件｜製造業Web"},{"id":61,"title":"ファイルアップロードの経験はありますか？","category":"Java","starred":false,"answer":"ファイルアップロード機能を新しく開発した経験はありません。ファイルやデータを扱う作業が必要な場合は、手順書や既存の仕組みを確認して対応します。","followup":"ファイルアップロード機能を担当する場合、何に注意しますか？","followupAnswer":"ファイル形式、サイズ制限、保存先、エラー時の動作を仕様書で確認します。","caseReference":""},{"id":62,"title":"バッチ処理やSpring Batchの経験はありますか？","category":"Java","starred":false,"answer":"Spring Batchを使った実務経験はありません。バッチ処理は、決められたタイミングや条件でデータをまとめて処理する仕組みだと理解しています。必要な場合は、既存の処理や設計書を確認して対応したいです。","followup":"バッチ処理とは何ですか？","followupAnswer":"人が画面で一件ずつ操作するのではなく、一定の条件や時間に従ってデータをまとめて処理する仕組みです。","caseReference":""},{"id":63,"title":"APIを開発した経験はありますか？","category":"Java","starred":true,"answer":"学習では、Spring Bootを使ってログイン用のAPIを作成した経験があります。Controllerでリクエストを受け取り、処理結果をJSON形式で返しました。実務では、主にSpringのControllerやServiceの画面連携処理を担当しました。","followup":"実務でもREST APIを新規開発しましたか？","followupAnswer":"実務では主に画面から呼び出すControllerやServiceの処理を担当しました。REST APIを作成した具体例は、学習で作ったログイン機能です。","caseReference":"第4案件｜製造業Web"},{"id":64,"title":"開発環境構築したことがございますか？どうやってされましたか？","category":"Java","starred":false,"answer":"開発環境は、現場の手順書を見ながら設定しました。分からない設定があれば、手順書やチームの人に確認して進めました。サーバー環境を一から構築した経験はありません。","followup":"開発環境では何を設定しましたか？","followupAnswer":"IDEの設定、ソースの取得、ビルド、DBへの接続などを、現場の手順書に沿って確認しました。","caseReference":""},{"id":65,"title":"画面開発とバックエンド開発では、どちらが得意ですか？","category":"Java","starred":false,"answer":"どちらも経験がありますが、画面側の開発の方が比較的慣れています。JavaScriptやjQueryで入力チェックや画面の動きを作ってきました。バックエンドでは、JavaやSQLを使った処理も経験しています。","followup":"バックエンドではどんな処理を担当しましたか？","followupAnswer":"Javaで入力内容の確認や業務処理を実装し、MyBatisとSQLを使ってDBの検索・更新を行いました。","caseReference":"第4案件｜製造業Web"},{"id":66,"title":"例外処理では何に注意しましたか？","category":"Java","starred":true,"answer":"エラーが起きた時に、原因を確認できるようにログを残すことを意識しています。また、画面にはユーザーが分かりやすいメッセージを表示し、難しいエラー内容をそのまま見せないようにします。","followup":"エラー内容をそのまま画面に表示しない理由は？","followupAnswer":"利用者に分かりにくいだけでなく、内部の情報が見えてしまう場合があるためです。","caseReference":"第4案件｜製造業Web"},{"id":67,"title":"トランザクションについて説明してください。","category":"Java","starred":false,"answer":"トランザクションは、複数のデータベース処理をまとめて一つの処理として扱う仕組みです。途中でエラーが起きた場合は変更を取り消し、データが不正な状態にならないようにします。","followup":"途中でエラーが起きたらどうなりますか？","followupAnswer":"一連の処理をロールバックし、途中までの更新だけが残らないようにします。","caseReference":"第4案件｜製造業Web"},{"id":68,"title":"どのデータベースを使用しましたか？","category":"SQL・DB","starred":false,"answer":"第1・第4プロジェクトではMySQL、第2・第3プロジェクトではOracleを使用しました。主にSQLによる検索・更新やデータ確認を担当しました。","followup":"OracleとMySQLでは何を担当しましたか？","followupAnswer":"Oracleでは配送依頼の検索・更新、MySQLでは受注・在庫情報の検索・更新や確認を行いました。","caseReference":"第2案件｜物流システム"},{"id":69,"title":"SQL文は得意ですか？どのようなコマンドを使えますか？","category":"SQL・DB","starred":true,"answer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用しました。SELECT、INSERT、UPDATEなどを使い、検索条件や更新結果を確認しました。複数テーブルを結合したSQLも扱いました。","followup":"SQLの結果はどう確認しましたか？","followupAnswer":"検索条件に合うデータが取得できるか確認し、更新前後のDBの値を比較します。","caseReference":"第2案件｜物流システム"},{"id":70,"title":"今まで最大で何テーブルを結合しましたか？","category":"SQL・DB","starred":true,"answer":"最大で4テーブル程度をJOINした経験があります。\n主に必要なデータを取得するために、INNER JOINやLEFT JOINを使用しました。","followup":"JOINする際に注意することは？","followupAnswer":"結合キーと条件を確認し、意図しない重複行や取得漏れがないかを見ます。","caseReference":"第2案件｜物流システム"},{"id":71,"title":"一番長いSQL文は何行くらいでしたか？","category":"SQL・DB","starred":false,"answer":"一番長いSQLは、50行程度でした。\n複数のテーブルをJOINして、検索条件を設定するSQLを扱いました。","followup":"長いSQLはどう確認しますか？","followupAnswer":"条件を分けて確認し、少ないテストデータで結果を比較します。","caseReference":"第4案件｜製造業Web"},{"id":72,"title":"SQLのチューニング、パフォーマンス向上、最適化の経験はありますか？","category":"SQL・DB","starred":true,"answer":"はい、あります。\n第4プロジェクトでは、MySQLを使って、簡単なSQLチューニングを行いました。\n主に検索性能を改善するために、INDEXの作成やJOIN条件の見直しを行いました。\nまた、EXPLAINを使って実行計画を確認しました。","followup":"1.性能が遅い場合は何を確認しますか？\n\n2.具体的にどのようなチューニングを行いましたか？\n\n3.EXPLAINでは何を確認しましたか？","followupAnswer":"1.まず件数や検索条件、実行時間を確認し、必要に応じてリーダーに相談します。\n2.検索条件によく使うカラムにINDEXを作成しました。また、JOIN条件を確認して、不要な処理がないか見直しました。\n3.主にテーブルのアクセス方法や、INDEXが使われているかを確認しました。","caseReference":"第4案件｜製造業Web"},{"id":73,"title":"テーブル設計の経験はありますか？","category":"SQL・DB","starred":false,"answer":"テーブルをゼロから設計した経験はありません。既存のテーブル定義書を見て、カラムやデータ型を確認し、SQLを使った検索・更新を行いました。","followup":"DB設計を担当する場合、何から確認しますか？","followupAnswer":"業務で必要なデータと既存テーブルの関係を確認し、主キーや重複データの扱いを整理します。","caseReference":"第4案件｜製造業Web"},{"id":74,"title":"論理削除と物理削除の違いを説明してください。","category":"SQL・DB","starred":false,"answer":"物理削除は、データをデータベースから削除することです。\n論理削除は、削除フラグなどを変更して、データ自体は残したまま通常の画面に表示しない方法です。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":75,"title":"MyBatis XMLで注意したことは何ですか？","category":"SQL・DB","starred":true,"answer":"MyBatisのXMLでは、SQLの条件やタグの書き方に注意しました。特に、検索条件を追加した時にSQLの構文エラーが起きないか確認しました。","followup":"動的SQLで注意する点は何ですか？","followupAnswer":"条件によってWHEREやANDの組み合わせが変わるため、条件がある場合とない場合の両方を確認します。","caseReference":"第2案件｜物流システム"},{"id":76,"title":"DB作業で気をつけていることは何ですか？","category":"SQL・DB","starred":false,"answer":"UPDATEやDELETEを実行する前に、WHEREの条件をよく確認します。まずSELECTで対象のデータを確認し、間違ったデータを変更しないように気をつけています。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":77,"title":"内部結合（INNER JOIN）と外部結合（OUTER JOIN）の違いを説明してください。","category":"SQL・DB","starred":false,"answer":"INNER JOINは、結合条件に合うデータだけを取得します。LEFT JOINは、左側のテーブルのデータをすべて残し、相手のテーブルに合うデータがない場合はNULLになります。","followup":"どの案件のDBで確認しましたか？","followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":"第4案件｜製造業Web"},{"id":78,"title":"単体テストシナリオ、または単体テスト仕様書を作成した経験はありますか？","category":"テスト","starred":false,"answer":"はい。第4プロジェクトでは、詳細設計書を参考にして、受注登録や在庫照会などの機能の単体テスト項目を整理しました。正常系だけでなく、必須項目の未入力や条件違いも確認しました。","followup":"どのような観点で項目を作りましたか？","followupAnswer":"画面初期表示、入力チェック、登録・検索の正常系と異常系を確認できるようにしました。","caseReference":"第4案件｜製造業Web"},{"id":79,"title":"単体テストはどうやって行いましたか？","category":"テスト","starred":true,"answer":"第1プロジェクトでは、予約登録や重複チェックの動作を確認しました。\n第4プロジェクトでは、詳細設計書とテスト仕様書を見ながら画面を操作し、\n期待結果と実際の結果を比較しました。","followup":"エビデンスは何を残しますか？","followupAnswer":"画面キャプチャ、必要なDBの確認結果、エラー時のログなどを記録します。","caseReference":"第4案件｜製造業Web"},{"id":80,"title":"画面テストの経験はありますか？","category":"テスト","starred":false,"answer":"はい、あります。画面の表示、入力チェック、ボタンを押した時の動き、画面遷移などを確認しました。テスト結果は画面キャプチャなどで記録しました。","followup":"具体的にどのような作業を担当しましたか？","followupAnswer":"はい、あります。画面の表示、入力チェック、ボタンを押した時の動き、画面遷移などを確認しました。テスト結果は画面キャプチャなどで記録しました。","caseReference":"第4案件｜製造業Web"},{"id":81,"title":"JUnitの経験はありますか？","category":"テスト","starred":false,"answer":"はい、JUnitを使った単体テストの経験があります。テスト対象のメソッドに対して、自分でテストコードを作成しました。ホワイトボックステストの観点で正常系・異常系や条件分岐を確認し、コードカバレッジ100％を目標に不足しているテストを追加しました。","followup":"テストコードはご自分で書かれましたか？","followupAnswer":"はい、自分で作成しました。最初はチームメンバーが作成した既存のテストコードを参考にし、担当する処理に合わせてテストケースを追加しました。","caseReference":"第4案件｜製造業Web"},{"id":82,"title":"結合テストの経験はありますか？","category":"テスト","starred":true,"answer":"はい。第2・第3・第4プロジェクトで、結合テストの実施を担当しました。\n用意されたテスト仕様書をもとに、画面からDBまでの処理を確認しました。","followup":"不具合が出た場合は？","followupAnswer":"再現手順と期待結果・実際の結果を整理し、ログやデータを確認してリーダーに報告します。","caseReference":"第2案件｜物流システム"},{"id":83,"title":"テストデータは自分で準備しましたか？","category":"テスト","starred":false,"answer":"第4プロジェクトでは、テスト条件に合わせて必要なデータを確認しました。データが不足する場合は、テスト環境で準備方法を確認して対応します。","followup":"データの確認方法は？","followupAnswer":"SQLで対象レコードを検索し、テスト前後の値を比較します。","caseReference":"第4案件｜製造業Web"},{"id":84,"title":"テストで一番注意していることは何ですか？","category":"テスト","starred":false,"answer":"仕様書どおりに動くかを確認することと、入力ミスなどの時にも正しく動くかを確認することです。正常な場合だけでなく、エラーの場合もテストするようにしています。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":85,"title":"バグが発生したら、どうやって解決しますか？","category":"テスト","starred":true,"answer":"第1プロジェクトでは、予約の重複チェックや社内ITのトラブル対応を経験しました。まず再現条件とログを確認し、画面・プログラム・DB・環境のどこに原因があるか切り分けます。難しい場合はリーダーに相談します。","followup":"切り分けの順番は？","followupAnswer":"エラーメッセージ、再現条件、入力データ、ログ、DBの値、環境設定の順に確認します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":86,"title":"バグを減らすために心がけていることは何ですか？","category":"テスト","starred":false,"answer":"修正したコードを見直し、仕様書に沿って動作確認をします。また、修正した機能だけでなく、周りの機能に影響がないかも確認します。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":87,"title":"一番難しかった不具合は何ですか？","category":"テスト","starred":true,"answer":"第3プロジェクトでは、問い合わせ内容だけでは原因が分からない不具合の調査が難しかったです。まず発生条件と操作内容を整理し、Linuxのログ、SQLの結果、既存のソースコードを確認しました。調査結果をリーダーに報告し、対応方針を相談しました。","followup":"その不具合の原因と解決結果は何でしたか？","followupAnswer":"原因をすぐに断定せず、ログとデータ、処理の流れを照らし合わせて切り分けました。自分で判断できない部分はリーダーに共有し、確認しながら対応しました。","caseReference":"第3案件｜銀行システム"},{"id":88,"title":"1日に何件くらい不具合対応できますか？","category":"テスト","starred":false,"answer":"軽微な不具合であれば、1日に3～5件程度対応できます。\n主に画面表示や入力チェックの修正などです。\n原因調査が必要な不具合の場合は、1日に1～2件程度です。","followup":"その数字の内訳を説明できますか？","followupAnswer":"再現条件と影響範囲を確認して、優先順位をリーダーに相談します。","caseReference":""},{"id":89,"title":"ホワイトボックステストとブラックボックステストの違いを説明してください。","category":"テスト","starred":false,"answer":"ホワイトボックステストは、プログラムの中の処理や条件分岐を確認するテストです。ブラックボックステストは、内部のコードを見ずに、入力に対して期待した結果になるかを確認するテストです。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":90,"title":"単体テストの観点漏れを防ぐために、何をしましたか？","category":"テスト","starred":false,"answer":"詳細設計書を読んで、正常な場合だけでなく、入力ミスやデータがない場合なども考えます。必要に応じてリーダーに確認し、テスト項目に漏れがないようにします。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":91,"title":"単体テストの完了条件は何ですか？","category":"テスト","starred":false,"answer":"テスト仕様書にある項目を実施し、期待した結果になることを確認したら完了です。不具合があった場合は修正後に再テストし、結果も記録します。","followup":"具体的にどの機能をテストしましたか？","followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":"第4案件｜製造業Web"},{"id":92,"title":"単体テスト仕様書とエビデンスは、どのように対応づけましたか？","category":"テスト","starred":false,"answer":"テスト項目番号を使って、仕様書の各項目とエビデンスを対応づけます。期待結果と実際の結果を記録し、必要に応じて画面キャプチャやDBの確認結果を添付します。","followup":"エビデンスには何を残しますか？","followupAnswer":"テスト項目番号、実施日、実施結果、画面キャプチャ、必要に応じてSQLの確認結果を残します。","caseReference":"第4案件｜製造業Web"},{"id":93,"title":"単体テスト仕様書は、1画面あたり何項目くらい作成しましたか？","category":"テスト","starred":true,"answer":"1画面あたり、だいたい20～30項目程度作成しました。\n\n主に正常系と異常系に分けて、必須入力チェックや文字数制限、\n境界値などを確認しました。","followup":"具体的にどんな異常系を確認しましたか？","followupAnswer":"必須項目の未入力、文字数制限、入力値の境界などを確認しました。","caseReference":"第4案件｜製造業Web"},{"id":94,"title":"Gitでは、どのような操作ができますか？","category":"ツール","starred":false,"answer":"Gitでは、最新のソースを取得したり、変更をコミットしたりする基本操作を経験しました。作業前に最新のコードを確認し、変更したファイルに問題がないか確認してから共有していました。","followup":"コンフリクトが起きたらどうしますか？","followupAnswer":"差分を確認し、どちらの変更を残すべきか担当者と相談してから解決します。","caseReference":""},{"id":95,"title":"Mavenは何に使いましたか？","category":"ツール","starred":true,"answer":"Mavenは、Javaのプロジェクトでライブラリを管理したり、アプリケーションをビルドしたりするために使います。開発環境でビルドを行い、エラーが出た場合は内容を確認しました。","followup":"Mavenでよく使う作業は何ですか？","followupAnswer":"依存ライブラリの確認と、プロジェクトのビルドです。pom.xmlの設定を確認します。","caseReference":""},{"id":96,"title":"開発ツールは何を使いましたか？","category":"ツール","starred":false,"answer":"主にEclipseとVS Codeを使いました。データベースの確認にはA5:SQL Mk-2を使い、ソースコードの管理にはGitを使いました。","followup":"Eclipseではどんな作業をしましたか？","followupAnswer":"Javaコードの編集、デバッグ、実行、エラー箇所の確認などを行いました。","caseReference":""},{"id":97,"title":"Linuxコマンドは使えますか？","category":"ツール","starred":false,"answer":"基本的なLinuxコマンドを使った経験があります。cdでフォルダを移動し、lsやcatでファイルを確認したり、grepでログの中から必要な文字を探したりしました。","followup":"ログを確認するときに使うコマンドは何ですか？","followupAnswer":"catやtailで内容を確認し、grepで必要な文字列を検索します。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":98,"title":"Shell Scriptの経験はありますか？","category":"ツール","starred":false,"answer":"既存のShellスクリプトを確認した経験があります。銀行向けシステムの臨時保守では、ログやShellを使ってデータ確認や原因調査を手伝いました。Shellをゼロから作った経験はありません。","followup":"Shellスクリプトを新規に作成しましたか？","followupAnswer":"既存のShellの内容を確認した経験が中心です。新規作成を主担当として行った経験はありません。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":99,"title":"A5:SQL Mk-2やSQL Developerは、どのように使いましたか？","category":"ツール","starred":false,"answer":"A5:SQL Mk-2を使って、データベースに接続し、SQLを実行してデータを確認しました。テストデータやテーブル定義を確認する時にも使いました。","followup":"その技術を使った具体的な作業を教えてください。","followupAnswer":"JavaとSpringを使って画面や業務処理を修正し、MyBatisとSQLでデータの検索・更新を行いました。","caseReference":""},{"id":100,"title":"AWS、Azure、GCPなどのクラウド経験はありますか？","category":"ツール","starred":false,"answer":"クラウド環境を一から構築した経験はありません。AWS S3については、少し触れた経験がありますが、詳しい構築や運用を担当したわけではありません。","followup":"AWSでどのような作業をしましたか？","followupAnswer":"S3に触れた経験はありますが、AWSの設計・構築を主担当として行った経験はありません。","caseReference":"第1案件｜自治体予約・IT運用"},{"id":101,"title":"開発手法は何でしたか？","category":"ツール","starred":false,"answer":"主にウォーターフォール開発を経験しました。設計、製造、テストの順番で作業し、担当する作業や進み具合をチームに報告していました。","followup":"ウォーターフォールではどの工程を担当しましたか？","followupAnswer":"主に詳細設計、製造、単体テスト、結合テストを担当しました。","caseReference":""},{"id":102,"title":"技術的に分からないことがあった場合、どう解決しますか？","category":"ツール","starred":false,"answer":"まず、既存のソースや手順書、エラーログを確認して、自分で調べます。それでも分からない時は、どこまで調べたかをまとめて、リーダーやチームの人に相談します。","followup":"調べても解決できない時はどうしますか？","followupAnswer":"エラー内容、試した方法、分からない点を整理して、リーダーやメンバーに相談します。","caseReference":""},{"id":103,"title":"報告・連絡・相談で意識していることは何ですか？","category":"ツール","starred":false,"answer":"結論から分かりやすく伝えることと、問題があれば早めに共有することを意識しています。相談する時は、何が起きたか、自分で何を確認したかを整理して伝えます。","followup":"問題が発生した時は何を報告しますか？","followupAnswer":"発生した現象、影響範囲、確認した内容、今後の対応予定を簡潔に報告します。","caseReference":""},{"id":104,"title":"不具合票、またはRedmineを使った経験はありますか？","category":"ツール","starred":true,"answer":"はい、Redmineを使った経験があります。不具合の内容や対応状況を確認し、修正後は対応内容やテスト結果を記録しました。また、必要に応じて担当者と情報を共有しました。","followup":"不具合票には何を記載しましたか？","followupAnswer":"発生した画面や操作手順、期待結果と実際の結果、対応内容、再テストの結果などを記録しました。","caseReference":""},{"id":105,"title":"セキュリティ面で注意していることはありますか？","category":"ツール","starred":false,"answer":"個人情報や業務データを扱う時は、必要な情報だけを確認し、許可された場所で管理することを意識しています。データを変更する時は、対象や条件をよく確認し、現場のルールに従います。","followup":"個人情報を含むログはどう扱いますか？","followupAnswer":"必要な範囲だけ確認し、現場のルールに従って保管・共有します。","caseReference":""},{"id":106,"title":"個人情報を扱うシステムで注意することは何ですか？","category":"ツール","starred":false,"answer":"必要な情報だけを表示・確認し、個人情報を不用意に共有しないことが大切です。ログやテスト結果を保存する時も、現場のルールを守り、個人が分かる情報を必要以上に残さないようにします。","followup":"テストデータを扱う時の注意点は？","followupAnswer":"個人情報を必要以上に使わず、指定されたテストデータや環境で確認します。","caseReference":""},{"id":107,"title":"大手SIerのプロジェクトに参画した経験はありますか？","category":"ツール","starred":false,"answer":"会社名や契約について詳しい内容は、営業担当に確認していただければと思います。私自身は、Webシステムの詳細設計、製造、テスト、不具合調査などを担当してきました。","followup":"どのような業務を担当しましたか？","followupAnswer":"自治体、物流、銀行、製造業向けのシステムで、主にJavaの開発とテストを担当しました。","caseReference":""},{"id":108,"title":"現場で自社名や顧客名を聞かれたらどう答えますか？","category":"ツール","starred":false,"answer":"契約や守秘義務に関わる内容なので、詳しい顧客名などはお答えできません。必要な情報については、営業担当に確認していただければと思います。","followup":"守秘義務のある情報を聞かれたらどうしますか？","followupAnswer":"公開してよい範囲で業務内容と技術を説明し、会社名や顧客名などは営業担当に確認します。","caseReference":""},{"id":109,"title":"今回の案件に入場前、何を勉強すればよいですか？と逆質問したいです。","category":"逆質問","starred":false,"answer":"もし参加できることになった場合、入場までに勉強しておいた方がよい技術や、確認しておいた方がよい業務知識はありますか？","followup":"なぜその逆質問をしたいのですか？","followupAnswer":"入場前に必要な知識を準備し、できるだけ早く業務に慣れたいからです。","caseReference":""},{"id":110,"title":"面談の最後に逆質問してください。","category":"逆質問","starred":false,"answer":"本日は詳しく説明していただき、ありがとうございました。もし参加できることになった場合、事前に勉強しておいた方がよい技術や知識はありますか？","followup":"ほかに確認したいことはありますか？","followupAnswer":"最初に担当する予定の工程や、チームで使っている開発ツールについて伺いたいです。","caseReference":""},{"id":111,"title":"システムの運用・保守では、具体的にどのような業務を担当しましたか？","category":"保守","starred":true,"answer":"自治体向けの案件では、Windows ServerやNAS、FTPサーバーの管理、PCのセットアップ、社内システムの不具合調査などを担当しました。銀行向けの案件では、問い合わせ調査、軽い不具合の修正、データ確認などの臨時保守を経験しました。","followup":"その経験について、具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":112,"title":"ユーザー（またはお客様）からの問い合わせには、どう対応していましたか？","category":"保守","starred":false,"answer":"まず、何が起きているか、いつから起きているかを確認します。その後、ログやデータ、既存の仕様を調べます。調査結果を整理してリーダーに報告し、必要な対応を相談します。","followup":"実際の案件での具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":113,"title":"本番データの修正（データ補正）を行う際、注意していたことは何ですか？","category":"保守","starred":false,"answer":"データを変更する時は、対象と変更内容をよく確認します。まずSQLで対象データを確認し、現場の手順や承認ルールに従って作業します。自分だけで判断せず、必要に応じてリーダーに確認します。","followup":"その経験について、具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":114,"title":"保守作業で不具合（障害）を発見した時、どのような流れで対応しましたか？","category":"保守","starred":true,"answer":"まず、不具合の内容や発生した状況を確認して、チームに報告します。その後、ログやソース、データを調べて原因と影響を確認します。修正する場合は、チームの方針に従って修正し、テストで確認します。","followup":"その経験について、具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":115,"title":"障害対応で「影響調査」をする際、何を意識していましたか？","category":"保守","starred":false,"answer":"修正する部分だけでなく、関連する画面や処理にも影響がないかを確認します。既存のソースやSQLを見て、ほかの機能が今までどおり動くかも確認します。","followup":"その経験について、具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":116,"title":"開発プロジェクトと、運用・保守業務の違いは何だと思いますか？","category":"保守","starred":false,"answer":"開発は、新しい機能を作ったり、機能を追加したりする仕事です。\n保守は、今あるシステムを安定して使えるように、問い合わせや不具合に対応する仕事です。\nどちらも、仕様を確認して正確に作業することが大切だと思います。","followup":"その経験について、具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":117,"title":"テレワーク（リモートワーク）の経験はありますか？どんなツールを使いましたか？","category":"實務","starred":false,"answer":"はい、テレワークの経験があります。チームとの連絡やオンライン会議では、チャットやWeb会議ツールを使いました。作業の進捗や不明点は早めに共有するようにしていました。","followup":"テレワークで気をつけたことは何ですか？","followupAnswer":"進捗や困っていることを早めに共有することです。チャットで伝わりにくい内容は、オンライン会議で確認しました。","caseReference":""},{"id":118,"title":"コミュニケーションで心がけていることは何ですか？","category":"實務","starred":false,"answer":"相手の話をよく聞いて、内容を正しく理解することを大切にしています。分からないことや曖昧な点があれば、勝手に判断せずに確認します。また、進み具合や問題は早めに報告します。","followup":"具体的にそのような場面では、どう対応しますか？","followupAnswer":"相手の話をよく聞いて、内容を正しく理解することを大切にしています。分からないことや曖昧な点があれば、勝手に判断せずに確認します。また、進み具合や問題は早めに報告します。","caseReference":""},{"id":119,"title":"チーム内で意見が食い違った場合、どう対応しますか？","category":"實務","starred":false,"answer":"まず相手の意見を聞き、何が違うのかを確認します。その後、仕様書や現場のルールをもとに話し合います。自分たちだけで決められない場合は、リーダーに相談します。","followup":"実際の案件での具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":120,"title":"業務に影響する持病や体調面の心配はありますか？","category":"實務","starred":false,"answer":"現在、業務に影響する健康上の問題はありません。","followup":"勤務上の配慮が必要なことはありますか？","followupAnswer":"現在、業務上の特別な配慮は必要ありません。","caseReference":""},{"id":121,"title":"1か月で最も高かった残業時間はどのくらいですか？","category":"實務","starred":false,"answer":"最も多かった月の正確な残業時間は、勤怠記録を確認する必要があります。繁忙期にはテストや不具合対応が重なることもありましたが、進捗と残作業を早めにリーダーに共有していました。","followup":"残業が多い時期はどのように対応しましたか？","followupAnswer":"作業の優先順位を整理し、残作業と完了見込みを早めに報告して、チームと相談しながら進めました。","caseReference":""},{"id":122,"title":"未経験の技術やパッケージを使うことになった場合、どう対応しますか？","category":"實務","starred":false,"answer":"未経験の技術でも、まず公式資料や既存のコード、手順書を確認して勉強します。分からない点は自分で調べた内容を整理して、チームの人に相談しながら覚えていきます。","followup":"実際の案件での具体例を教えてください。","followupAnswer":"例えば、施設予約システムでは、同じ施設と時間に予約が重ならないようにチェック処理を実装しました。正常な場合だけでなく、入力エラーの場合も確認しました。","caseReference":""},{"id":123,"title":"開発環境（ローカル環境）の構築経験はありますか？","category":"實務","starred":false,"answer":"開発環境は、現場の手順書に沿って設定した経験があります。IDEの設定やソースの取得、ビルド、データベース接続などを確認し、分からない点は手順書やチームの人に確認しました。","followup":"その経験を具体的に説明してください。","followupAnswer":"担当した作業について、使用した技術、確認した内容、対応結果の順に説明します。","caseReference":""},{"id":124,"title":"複数の作業を同時に頼まれたら、どうしますか？","answer":"まず、期限と優先順位を確認します。\n自分で決められない場合は、リーダーに相談して進めます。","followup":"優先順位はどう決めますか？","category":"實務","starred":false,"followupAnswer":"まず、期限と優先順位を確認します。自分で決められない場合は、リーダーに相談して進めます。","caseReference":""},{"id":125,"title":"作業が予定より遅れそうな場合、どうしますか？","answer":"遅れそうだと分かった時点で、早めに報告します。\n原因と残っている作業を伝えて、対応を相談します。","followup":"どのタイミングで報告しますか？","category":"實務","starred":false,"followupAnswer":"遅れそうだと分かった時点で、早めに報告します。原因と残っている作業を伝えて、対応を相談します。","caseReference":""},{"id":126,"title":"仕様書の内容が分からない場合、どうしますか？","answer":"まず仕様書と既存コードを確認します。\nそれでも分からない場合は、疑問点を整理して質問します。","followup":"担当者がいない場合はどうしますか？","category":"實務","starred":false,"followupAnswer":"まず仕様書と既存コードを確認します。それでも分からない場合は、疑問点を整理して質問します。","caseReference":""},{"id":127,"title":"作業中に仕様変更があった場合、どう対応しますか？","answer":"変更内容と影響する機能を確認します。\nその後、必要な修正とテストを行います。","followup":"影響範囲はどう確認しますか？","category":"實務","starred":false,"followupAnswer":"変更内容と影響する機能を確認します。その後、必要な修正とテストを行います。","caseReference":""},{"id":128,"title":"自分のミスに気づいたら、どうしますか？","answer":"まず状況を確認し、早めに報告します。\n影響を調べて修正し、同じミスを防ぐ方法を考えます。","followup":"再発を防ぐために何をしますか？","category":"實務","starred":false,"followupAnswer":"まず状況を確認し、早めに報告します。影響を調べて修正し、同じミスを防ぐ方法を考えます。","caseReference":""},{"id":129,"title":"コードレビューで修正を求められたら、どうしますか？","answer":"指摘内容を確認し、理由を理解してから修正します。\n分からない点は質問します。","followup":"レビュー指摘を修正した後は何をしますか？","category":"Java","starred":false,"followupAnswer":"指摘された箇所を修正し、関連する処理に影響がないか確認してから再レビューを依頼します。","caseReference":""},{"id":130,"title":"自分が作った機能がテストで何度も失敗したらどうしますか？","answer":"失敗した条件とエラーを確認します。\nコードやSQLを調べて、修正後に再テストします。","followup":"具体的にどの機能をテストしましたか？","category":"テスト","starred":false,"followupAnswer":"第1プロジェクトでは予約登録と重複チェック、第4プロジェクトでは受注登録や在庫照会の正常系・異常系を確認しました。","caseReference":""},{"id":131,"title":"他のメンバーの作業が遅れている場合、どうしますか？","answer":"状況を確認し、自分にできることがあれば協力します。\n必要ならリーダーに相談します。","followup":"自分も忙しい場合はどうしますか？","category":"實務","starred":false,"followupAnswer":"状況を確認し、自分にできることがあれば協力します。必要ならリーダーに相談します。","caseReference":""},{"id":132,"title":"自分の作業が終わったら、次に何をしますか？","answer":"作業結果とテスト結果を確認し、リーダーに報告します。\nその後、次の作業を確認します。","followup":"次の作業が決まっていない場合は？","category":"實務","starred":false,"followupAnswer":"作業結果とテスト結果を確認し、リーダーに報告します。その後、次の作業を確認します。","caseReference":""},{"id":133,"title":"品質と作業スピードのどちらを重視しますか？","answer":"どちらも大切です。仕様を正しく理解し、確認しながら効率よく進めたいです。","followup":"納期が厳しい場合はどうしますか？","category":"實務","starred":false,"followupAnswer":"どちらも大切です。仕様を正しく理解し、確認しながら効率よく進めたいです。","caseReference":""},{"id":134,"title":"技術的な内容をITに詳しくないお客様に説明するとき、何に気をつけますか？","answer":"難しい言葉を避け、簡単な言葉や具体例を使って説明します。","followup":"伝わらなかったらどうしますか？","category":"實務","starred":false,"followupAnswer":"難しい言葉を避け、簡単な言葉や具体例を使って説明します。","caseReference":""},{"id":135,"title":"お客様から急な依頼を受けたら、どうしますか？","answer":"依頼内容と期限を確認します。\n今の作業への影響も確認し、必要ならリーダーに相談します。","followup":"対応できない場合はどう伝えますか？","category":"實務","starred":false,"followupAnswer":"依頼内容と期限を確認します。今の作業への影響も確認し、必要ならリーダーに相談します。","caseReference":""},{"id":136,"title":"チームで仕事をするとき、どのような役割を担当したいですか？","answer":"まず自分の担当作業をしっかり進めたいです。\n将来は設計やチームのサポートもできるようになりたいです。","followup":"チームのために何ができますか？","category":"實務","starred":false,"followupAnswer":"まず自分の担当作業をしっかり進めたいです。将来は設計やチームのサポートもできるようになりたいです。","caseReference":""},{"id":137,"title":"新しい現場に入ったら、最初に何を確認しますか？","answer":"業務の流れ、システムの仕様、開発環境、チームのルールを確認します。","followup":"早く慣れるために何をしますか？","category":"實務","starred":false,"followupAnswer":"業務の流れ、システムの仕様、開発環境、チームのルールを確認します。","caseReference":""},{"id":138,"title":"今回の案件で、自分の経験をどのように活かせると思いますか？","answer":"Javaの開発や詳細設計、テストの経験を活かし、担当機能を理解してチームに貢献したいです。","followup":"経験が足りない部分はどう補いますか？","category":"實務","starred":false,"followupAnswer":"Javaの開発や詳細設計、テストの経験を活かし、担当機能を理解してチームに貢献したいです。","caseReference":""},{"id":139,"title":"今まで何人ぐらいのチームで作業しましたか？","answer":"案件によって異なりますが、6～8人程度のチームで作業していました。私は主に開発メンバーとして、詳細設計、製造、テストを担当し、進捗や問題点をリーダーに報告しました。","followup":"リーダーとしての経験はありますか？","category":"プロジェクト","starred":false,"followupAnswer":"リーダーの経験はありません。開発メンバーとして担当作業を進め、必要な報告・連絡・相談を行っていました。","caseReference":""},{"id":140,"title":"リーダーの指示を受けて作業していましたか？","answer":"はい。担当作業について指示や仕様を確認してから進め、進捗や問題があれば報告・相談していました。","followup":"一人で判断する作業もありましたか？","category":"實務","starred":false,"followupAnswer":"はい。担当作業について指示や仕様を確認してから進め、進捗や問題があれば報告・相談していました。","caseReference":""},{"id":141,"title":"リーダーを担当した経験はありますか？","answer":"いいえ、リーダーの経験はありません。これまではメンバーとして、リーダーの指示を確認しながら詳細設計、開発やテストを担当しました。","followup":"メンバーのサポート経験はありますか？","category":"實務","starred":false,"followupAnswer":"いいえ、リーダーの経験はありません。これまではメンバーとして、リーダーの指示を確認しながら詳細設計、開発やテストを担当しました。","caseReference":""},{"id":142,"title":"お客様とは直接やり取りしていましたか？","answer":"開発案件では、お客様とのやり取りは主にリーダーを通して行っていました。私は担当作業の進捗や確認したい点をリーダーに報告・相談していました。","followup":"どんな問い合わせに対応しましたか？","category":"實務","starred":false,"followupAnswer":"開発案件では、お客様とのやり取りは主にリーダーを通して行っていました。私は担当作業の進捗や確認したい点をリーダーに報告・相談していました。","caseReference":""},{"id":143,"title":"他のチームやお客様とスケジュール調整をした経験はありますか？","answer":"お客様との直接のスケジュール調整は、主にリーダーが担当していました。私は自分の作業の進捗を報告し、調整が必要な場合はリーダーに相談していました。","followup":"納期が変わった場合はどうしますか？","category":"實務","starred":false,"followupAnswer":"お客様との直接のスケジュール調整は、主にリーダーが担当していました。私は自分の作業の進捗を報告し、調整が必要な場合はリーダーに相談していました。","caseReference":""},{"id":144,"title":"既存の機能を参考にして開発しましたか？","answer":"既存コードや詳細設計書を参考にした開発経験があります。ただし、基本設計をゼロから一人で担当した経験はありません。必要な場合は、仕様を確認しながら学びたいです。","followup":"既存コードを参考にする時、何を確認しますか？","category":"Java","starred":false,"followupAnswer":"処理の入口、関連するServiceやMapper、SQL、画面への影響を確認します。","caseReference":""},{"id":145,"title":"参考資料がなくても、ゼロから設計できますか？","answer":"基本設計を担当した経験はありません。\n詳細設計、製造、テストの経験はあります。\nゼロから基本設計を行う場合は、まず仕様や進め方を確認し、\nリーダーに相談しながら取り組みたいです。","followup":"その作業は第何プロジェクトで経験しましたか？","category":"設計","starred":false,"followupAnswer":"第3プロジェクトでは既存の詳細設計書を修正し、第4プロジェクトでは担当画面の詳細設計書を作成しました。基本設計の主担当経験はありません。","caseReference":""},{"id":146,"title":"基本設計では、画面や機能を何件ぐらい担当しましたか？","answer":"基本設計を担当した経験はありません。\n第3プロジェクトでは既存の詳細設計書の修正、\n第4プロジェクトでは詳細設計書の新規作成を担当しました。","followup":"詳細設計では何を担当しましたか？","category":"設計","starred":false,"followupAnswer":"基本設計の実務経験はありませんが、詳細設計では画面項目、入力チェック、検索条件、データベースの更新内容などをまとめました。","caseReference":""},{"id":147,"title":"入力項目がある画面の設計経験はありますか？","answer":"入力チェックの実装や画面修正の経験はありますが、\n基本設計として画面を設計した経験はありません。","followup":"その作業は第何プロジェクトで経験しましたか？","category":"設計","starred":false,"followupAnswer":"第3プロジェクトでは既存の詳細設計書を修正し、第4プロジェクトでは担当画面の詳細設計書を作成しました。基本設計の主担当経験はありません。","caseReference":""},{"id":148,"title":"エラーが出たとき、原因をどう切り分けますか？","answer":"まずエラーメッセージとログを確認します。\n次に入力データ、DBの内容、環境設定やコードを順番に調べます。","followup":"原因を切り分ける順番は？","category":"テスト","starred":false,"followupAnswer":"まず再現条件とエラーログを確認し、画面側、Java側、SQL・DB側のどこに問題があるか順番に調べます。","caseReference":""},{"id":149,"title":"Oracleの環境構築を自分で行った経験はありますか？","answer":"Oracleの環境構築を自分で行った経験はありません。\n第2プロジェクトでは、既存のOracle環境を使用して、\nSQLの作成や修正、データの確認などを行いました。","followup":"Oracleではどのような作業を担当しましたか？","category":"SQL・DB","starred":false,"followupAnswer":"既存のOracle環境を使い、SQLで配送依頼データの検索・更新と結果確認を行いました。","caseReference":""},{"id":150,"title":"C#を使った開発経験はありますか？","answer":"主にJavaを使った開発経験があります。C#については、実務経験があるとは言えませんが、必要であれば勉強して対応したいです。","followup":"C#が必要な場合はどうしますか？","category":"Java","starred":false,"followupAnswer":"Javaとの共通点を確認し、既存コードと公式資料を使って基本文法から学びます。","caseReference":""},{"id":151,"title":"PL/SQLを使った開発経験はありますか？","answer":"SQLを使ったデータの取得や更新は経験があります。PL/SQLでの本格的な開発経験については、現時点ではありません。","followup":"PL/SQLと通常のSQLの違いは何ですか？","category":"SQL・DB","starred":false,"followupAnswer":"SQLはデータの検索・更新に使います。PL/SQLはOracleで条件分岐や繰り返し処理も記述できます。","caseReference":""},{"id":152,"title":"SQLの結果が正しいか、どう確認しましたか？","answer":"検索条件と取得したデータを確認します。必要に応じてテストデータを使い、想定した件数や内容と一致するかチェックします。","followup":"どの案件のDBで確認しましたか？","category":"SQL・DB","starred":false,"followupAnswer":"第2プロジェクトではOracle、第4プロジェクトではMySQLを使用し、検索条件や更新結果をSQLで確認しました。","caseReference":""},{"id":153,"title":"QA対応では、どのような作業を行いましたか？","answer":"QA対応では、主にシステムの仕様や動作に関する問い合わせに対応しました。\nまず質問内容を確認し、設計書やソースコード、ログなどを調査しました。\nその後、調査結果を整理して、リーダーに報告しました。","followup":"すぐに回答できない場合はどうしますか？","category":"保守","starred":false,"followupAnswer":"まず問い合わせ内容を整理し、設計書、ソースコード、ログを調べます。すぐに原因が分からない場合は、調査状況をリーダーに共有し、確認を進めます。","caseReference":""},{"id":154,"title":"詳細設計書のレビューでは、どのような指摘を受けましたか？","category":"設計","answer":"詳細設計書のレビューでは、入力チェックの条件や検索条件の書き方について指摘を受けました。指摘内容を仕様書と照らし合わせて確認し、設計書を修正して再レビューをお願いしました。","followup":"指摘を受けた後は、どのように修正しましたか？","followupAnswer":"仕様書と既存の処理を確認し、入力チェックの条件や検索条件を具体的に書き直しました。その後、再レビューをお願いしました。","caseReference":"第3案件｜銀行システム","starred":true},{"id":155,"title":"レビューの指摘に対して、どのように対応しましたか？","category":"設計","answer":"まず指摘内容を読み、分からない点はリーダーに確認します。\nその後、詳細設計書を修正し、同じ問題が他の箇所にもないか確認します。\n第3プロジェクトの設計書修正でも、この流れを意識していました。","followup":"修正したあと、何を確認しますか？","followupAnswer":"指摘した内容が正しく反映されているか、\n関連する記載にも矛盾「むじゅん」がないか確認します。","caseReference":"第3案件｜銀行システム","starred":false},{"id":156,"title":"UMLやクラス図を作成した経験はありますか？","category":"設計","answer":"Javaのクラス構成やController、Service、Mapperの役割は理解しています。\nただし、業務でUMLやクラス図を自分で新規作成した経験はありません。","followup":"クラス図には何を表しますか？","followupAnswer":"クラスの属性やメソッド、クラス同士の関係を表します。実務で図を新規作成した経験とは分けて説明します。","caseReference":"","starred":false},{"id":157,"title":"1か月に何ステップぐらい製造しましたか？","category":"Java","answer":"案件や作業内容によって異なりますが、1か月あたり約1,000ステップ程度を目安にしています。主にJavaで既存機能の修正や追加開発を担当しました。正確な実績は集計記録を確認する必要があります。","followup":"ステップ数には何を含めていますか？","followupAnswer":"追加・修正したJavaのソースコードを基準に考えています。調査やテストの時間は、ステップ数とは分けて説明します。","caseReference":"第2案件｜物流システム","starred":false},{"id":158,"title":"1日に何ステップぐらいコーディングできますか？","category":"Java","answer":"作業内容によって変わりますが、1日100～200ステップ程度が一つの目安です。新規開発か既存機能の改修かによっても異なります。コード量だけでなく、仕様の確認やテストも重視しています。","followup":"コーディング以外には何をしますか？","followupAnswer":"仕様書の確認、既存コードの調査、単体テスト、不具合修正などを行います。","caseReference":"第2案件｜物流システム","starred":false},{"id":159,"title":"1週間で何画面ぐらい開発しましたか？","category":"Java","answer":"画面の規模によりますが、1週間で1～2画面程度を一つの目安にしています。第1プロジェクトでは予約登録や検索画面の入力チェック、検索処理などを担当しました。新規か改修かによって作業量は変わります。","followup":"新規画面と既存画面の改修では何が違いますか？","followupAnswer":"新規画面では処理を一から実装する部分が多く、改修では既存の仕様や影響範囲を確認することが重要です。","caseReference":"第1案件｜自治体予約・IT運用","starred":false},{"id":160,"title":"今までで一番コーディング量が多かった案件はどれですか？","category":"Java","answer":"コーディング量が多かった案件として、第4プロジェクトの製造業向けWebシステムを挙げています。受注登録や在庫照会、出荷指示などの機能について、JavaとSpring、MyBatisを使い、詳細設計から製造、テストまで担当しました。","followup":"どんな処理を実装しましたか？","followupAnswer":"受注登録の入力チェックやデータ登録、在庫照会の検索・表示処理などを担当しました。","caseReference":"第4案件｜製造業Web","starred":false},{"id":161,"title":"JavaScriptでどのようなイベント処理を実装しましたか？","category":"Java","answer":"第1プロジェクトでは、予約画面でJavaScriptとjQueryを使用しました。入力内容を確認する処理や、ボタン操作に合わせた画面のチェック処理を実装しました。","followup":"具体的にどんな入力チェックですか？","followupAnswer":"必須項目の未入力や日付の条件などを確認し、入力に問題があれば画面にメッセージを表示する処理です。","caseReference":"第1案件｜自治体予約・IT運用","starred":false},{"id":162,"title":"1画面あたりの入力項目数はどのぐらいでしたか？","category":"設計","answer":"第4プロジェクトの受注登録画面などでは、1画面あたり10～15項目程度でした。商品コードや数量、納期などの項目について、入力チェックや処理内容を詳細設計書にまとめました。","followup":"どの項目に入力チェックが必要でしたか？","followupAnswer":"商品コードや数量などの必須項目について、未入力や入力形式を確認しました。","caseReference":"第4案件｜製造業Web","starred":true},{"id":163,"title":"単体テスト仕様書は何を参考にして作成しましたか？","category":"テスト","answer":"第4プロジェクトでは、詳細設計書と既存のテスト仕様書を参考にしました。正常系だけでなく、必須項目が空の場合などの異常系も確認できるようにしました。","followup":"どんなテスト項目を作りましたか？","followupAnswer":"画面の初期表示、登録処理、検索条件、入力チェック、エラーメッセージなどです。","caseReference":"第4案件｜製造業Web","starred":false},{"id":164,"title":"単体テスト仕様書のレビューでは、どのような指摘を受けましたか？","category":"テスト","answer":"レビューでは、異常系のテストケースの不足や、期待結果の書き方について指摘を受けました。例えば必須項目が未入力の場合のケースを追加し、期待結果を具体的に書き直す対応です。","followup":"レビューで指摘を受けたらどうしますか？","followupAnswer":"指摘内容を確認し、テストケースや期待結果を修正します。必要に応じてリーダーに再確認してもらいます。","caseReference":"第4案件｜製造業Web","starred":false},{"id":165,"title":"JUnitのテストコードは自分で作成しましたか？","category":"テスト","answer":"はい、自分で作成しました。既存のJUnitテストコードを参考にしながら、正常系・異常系や条件分岐を確認するテストを追加しました。また、コードカバレッジを確認し、不足しているケースを補いました。","followup":"テストコードを作るときに気をつけたことは何ですか？","followupAnswer":"対象の処理や分岐条件を確認し、正常系だけでなく異常系も漏れなくテストできるようにしました。","caseReference":"第4案件｜製造業Web","starred":false},{"id":166,"title":"結合テスト仕様書を作成した経験はありますか？","category":"テスト","answer":"結合テスト仕様書を自分で新規作成した経験はありません。ただし、既存の結合テスト仕様書に沿って、画面間の連携やデータの登録・更新結果を確認した経験があります。","followup":"結合テストでは何を確認しましたか？","followupAnswer":"画面で入力した内容がDBに正しく反映されるか、関連する画面で正しい情報が表示されるかなどを確認しました。","caseReference":"第2案件｜物流システム","starred":false},{"id":167,"title":"テストケースが一番多かった時は、何項目ぐらいありましたか？","category":"テスト","answer":"第4プロジェクトでは、1画面あたり20～30項目程度の単体テスト項目を扱いました。最も多かった時の正確な件数は確認が必要ですが、項目が多い場合は正常系・異常系に分けて管理していました。","followup":"テスト項目数が多い場合、どう管理しましたか？","followupAnswer":"項目番号を付けて正常系・異常系に分類し、実施状況と結果を記録しました。","caseReference":"第4案件｜製造業Web","starred":false},{"id":168,"title":"自分でテーブルを作成した経験はありますか？","category":"SQL・DB","answer":"実務で新しいテーブルを作成した経験はありません。ただし、学習環境ではMySQLを使ってCREATE TABLE文でテーブルを作成しました。INSERT、SELECT、UPDATE、DELETEなどのSQLも練習しました。","followup":"CREATE TABLEでは何を指定しますか？","followupAnswer":"テーブル名、カラム名、データ型、PRIMARY KEYやNOT NULLなどの制約を指定します。","caseReference":"第4案件｜製造業Web","starred":false},{"id":169,"title":"今まで扱ったデータ量は最大でどれぐらいでしたか？","category":"SQL・DB","answer":"Oracleで配送依頼データ、MySQLで受注・在庫データを扱いました。最大レコード件数の正確な数字は把握していません。データ量が多い場合は、検索条件やSQLの実行計画を確認し、性能に注意していました。","followup":"大量データを扱うときは何に注意しますか？","followupAnswer":"検索条件と取得件数を確認し、必要に応じてINDEXやJOIN条件、EXPLAINの実行計画を確認します。","caseReference":"第2案件｜物流システム","starred":false},{"id":170,"title":"GitとSVNの違いを説明できますか？","category":"實務","answer":"はい。Gitは分散型のバージョン管理システムで、ローカルにも履歴を持てます。SVNは中央集中型で、主にサーバー側で履歴を管理します。","followup":"GitとSVNでは、履歴の管理方法がどう違いますか？","followupAnswer":"Gitは各開発者のローカルにも履歴を持ち、SVNは中央サーバーで履歴を管理します。","caseReference":"","starred":false},{"id":171,"title":"帳票出力機能を開発した経験はありますか？","category":"Java","answer":"これまでの4案件では、帳票出力を主な担当として開発した経験はありません。第4プロジェクトでは、受注や在庫の画面機能を担当しました。","followup":"帳票出力を担当する場合、何を確認しますか？","followupAnswer":"出力項目、レイアウト、対象データの抽出条件、ファイル形式、文字化けの有無を確認します。","caseReference":"第4案件｜製造業Web","starred":false}];
const RECORDING_QUESTIONS=[{"id": 139, "title": "今まで何人ぐらいのチームで作業しましたか？", "answer": "案件によって人数が違います。正確な人数は職務経歴書を確認してお伝えします。", "followup": "その中で、ご自身の担当は何でしたか？", "category": "錄音追問", "starred": false}, {"id": 140, "title": "リーダーの指示を受けて作業していましたか？", "answer": "はい。担当作業について指示や仕様を確認してから進め、進捗や問題があれば報告・相談していました。", "followup": "一人で判断する作業もありましたか？", "category": "錄音追問", "starred": false}, {"id": 141, "title": "リーダーを担当した経験はありますか？", "answer": "正式なリーダーとしての経験については、職務経歴書の担当範囲に沿ってお答えします。まずは担当作業を確実に進めることを大切にしています。", "followup": "メンバーのサポート経験はありますか？", "category": "錄音追問", "starred": false}, {"id": 142, "title": "お客様とは直接やり取りしていましたか？", "answer": "問い合わせ対応の経験はあります。案件でのお客様との連絡方法は、チームのルールに合わせて対応します。", "followup": "どんな問い合わせに対応しましたか？", "category": "錄音追問", "starred": false}, {"id": 143, "title": "他のチームやお客様とスケジュール調整をした経験はありますか？", "answer": "自分の作業の進捗確認や報告を大切にしてきました。調整が必要な場合は、リーダーと相談して進めます。", "followup": "納期が変わった場合はどうしますか？", "category": "錄音追問", "starred": false}, {"id": 144, "title": "既存の機能を参考にして開発しましたか？", "answer": "はい。既存コードや仕様書を確認し、処理の流れを理解してから修正や追加開発を進めました。", "followup": "参考にしたコードのどこを確認しますか？", "category": "錄音追問", "starred": false}, {"id": 145, "title": "参考資料がなくても、ゼロから設計できますか？", "answer": "詳細設計や開発の経験はありますが、資料がない状態での設計は、まず要件を確認する必要があります。分からない点は相談しながら進めたいです。", "followup": "最初に何を確認しますか？", "category": "錄音追問", "starred": false}, {"id": 146, "title": "基本設計では、画面や機能を何件ぐらい担当しましたか？", "answer": "主な経験は詳細設計以降です。基本設計で担当した件数については、実際の担当範囲に沿ってお答えします。", "followup": "詳細設計では何を担当しましたか？", "category": "錄音追問", "starred": false}, {"id": 147, "title": "入力項目がある画面の設計経験はありますか？", "answer": "画面の修正や入力チェックの実装経験があります。基本設計としての担当範囲は分けて説明します。", "followup": "入力チェックでは何を確認しましたか？", "category": "錄音追問", "starred": false}, {"id": 148, "title": "エラーが出たとき、原因をどう切り分けますか？", "answer": "まずエラーメッセージとログを確認します。次に入力データ、DBの内容、環境設定やコードを順番に調べます。", "followup": "データが原因かどうかは、どう確認しますか？", "category": "錄音追問", "starred": false}, {"id": 149, "title": "Oracleの環境構築を自分で行った経験はありますか？", "answer": "Oracleを使った開発やSQLの確認については説明できますが、DB環境を自分で構築した経験とは分けてお答えします。", "followup": "Oracleではどんな作業をしましたか？", "category": "錄音追問", "starred": false}, {"id": 150, "title": "C#を使った開発経験はありますか？", "answer": "主にJavaを使った開発経験があります。C#については、実務経験があるとは言えませんが、必要であれば勉強して対応したいです。", "followup": "Javaとの違いを勉強していますか？", "category": "錄音追問", "starred": false}, {"id": 151, "title": "PL/SQLを使った開発経験はありますか？", "answer": "SQLを使ったデータの取得や更新は経験があります。PL/SQLでの本格的な開発経験については、現時点ではありません。", "followup": "SQLではどんな文を使いましたか？", "category": "錄音追問", "starred": false}, {"id": 152, "title": "SQLの結果が正しいか、どう確認しましたか？", "answer": "検索条件と取得したデータを確認します。必要に応じてテストデータを使い、想定した件数や内容と一致するかチェックします。", "followup": "JOINを使った場合はどう確認しますか？", "category": "錄音追問", "starred": false}, {"id": 153, "title": "QA対応では、どのような作業を行いましたか？", "answer": "質問の内容を確認し、仕様書やコードを調べて回答する作業だと理解しています。経験のある作業範囲は具体的に説明します。", "followup": "すぐに回答できない場合はどうしますか？", "category": "錄音追問", "starred": false}];
const CANDIDATES=[{"id": 124, "title": "複数の作業を同時に頼まれたら、どうしますか？", "answer": "まず、期限と優先順位を確認します。自分で決められない場合は、リーダーに相談して進めます。", "followup": "優先順位はどう決めますか？", "category": "候選題", "starred": false}, {"id": 125, "title": "作業が予定より遅れそうな場合、どうしますか？", "answer": "遅れそうだと分かった時点で、早めに報告します。原因と残っている作業を伝えて、対応を相談します。", "followup": "どのタイミングで報告しますか？", "category": "候選題", "starred": false}, {"id": 126, "title": "仕様書の内容が分からない場合、どうしますか？", "answer": "まず仕様書と既存コードを確認します。それでも分からない場合は、疑問点を整理して質問します。", "followup": "担当者がいない場合はどうしますか？", "category": "候選題", "starred": false}, {"id": 127, "title": "作業中に仕様変更があった場合、どう対応しますか？", "answer": "変更内容と影響する機能を確認します。その後、必要な修正とテストを行います。", "followup": "影響範囲はどう確認しますか？", "category": "候選題", "starred": false}, {"id": 128, "title": "自分のミスに気づいたら、どうしますか？", "answer": "まず状況を確認し、早めに報告します。影響を調べて修正し、同じミスを防ぐ方法を考えます。", "followup": "再発を防ぐために何をしますか？", "category": "候選題", "starred": false}, {"id": 129, "title": "コードレビューで修正を求められたら、どうしますか？", "answer": "指摘内容を確認し、理由を理解してから修正します。分からない点は質問します。", "followup": "納得できない場合はどうしますか？", "category": "候選題", "starred": false}, {"id": 130, "title": "自分が作った機能がテストで何度も失敗したらどうしますか？", "answer": "失敗した条件とエラーを確認します。コードやSQLを調べて、修正後に再テストします。", "followup": "原因が分からない場合はどうしますか？", "category": "候選題", "starred": false}, {"id": 131, "title": "他のメンバーの作業が遅れている場合、どうしますか？", "answer": "状況を確認し、自分にできることがあれば協力します。必要ならリーダーに相談します。", "followup": "自分も忙しい場合はどうしますか？", "category": "候選題", "starred": false}, {"id": 132, "title": "自分の作業が終わったら、次に何をしますか？", "answer": "作業結果とテスト結果を確認し、リーダーに報告します。その後、次の作業を確認します。", "followup": "次の作業が決まっていない場合は？", "category": "候選題", "starred": false}, {"id": 133, "title": "品質と作業スピードのどちらを重視しますか？", "answer": "どちらも大切です。仕様を正しく理解し、確認しながら効率よく進めたいです。", "followup": "納期が厳しい場合はどうしますか？", "category": "候選題", "starred": false}, {"id": 134, "title": "技術的な内容をITに詳しくないお客様に説明するとき、何に気をつけますか？", "answer": "難しい言葉を避け、簡単な言葉や具体例を使って説明します。", "followup": "伝わらなかったらどうしますか？", "category": "候選題", "starred": false}, {"id": 135, "title": "お客様から急な依頼を受けたら、どうしますか？", "answer": "依頼内容と期限を確認します。今の作業への影響も確認し function card(x,full=true){return `<article class="card" data-qid="${x.id}" id="q-${x.id}"><span class="tag">${x.category==='候選題'?'待確認 · 候選題':esc(x.category)} · Q${x.id}</span>${x.caseReference?`<span class="tag" style="margin-left:6px;background:#eef8f2;color:#246346">${esc(x.caseReference)}</span>`:''}<div class="qtitle">${highlight(x.title)}</div>${full?`<div class="answer">${highlight(x.answer)}</div>`:''}${x.followup&&full?`<div class="follow"><b>可能的追問：</b><button class="follow-link" onclick="showFollowup(${x.id})">${esc(x.followup)} ↗</button></div>`:''}<div class="actions">${btn(x.starred?'★ 已收藏':'☆ 收藏',`star(${x.id})`)}${btn('複製答案',`copyAnswer(${x.id})`)}${!full?btn('查看回答',`openQuestion(${x.id})`):''}${x.category!=='候選題'?btn('✎ 編輯',`editQA(${x.id})`):''}${btn('單題查看',`openQuestion(${x.id})`)}</div></article>`}
function renderIntro(){let idx=selected%INTRO.length;const all=INTRO.map((x,i)=>`<div class="step card" style="border-left:4px solid ${i===idx?'#4868e8':'#e4e7ef'}"><span class="tag">${i+1} / ${INTRO.length}</span><h3>${esc(x.title)}</h3><div class="cue">記憶關鍵字：${esc(x.hint)}</div><div class="answer">${esc(x.answer)}</div><div class="actions">${btn('複製這段',`copyText(INTRO[${i}].answer)`)}${btn('✎ 編輯這段',`editIntro(${i})`)}${btn('只看這段',`jumpIntro(${i})`)}</div></div>`).join('');let x=INTRO[idx];$('content').innerHTML=`<div class="heading"><div><h1>🎙 看著履歷介紹案件</h1><p>依照履歷介紹：自我介紹 → 四個案件 → 結尾</p></div><span class="tag">約 4～5 分鐘</span></div><div class="notice">本模式是口說稿，不是履歷檔案預覽。請另外開啟你的職務経歴書，依照案件內容一起練習。</div><div class="toolbar"><button class="btn ${showFull?'active':''}" onclick="showFull=true;render()">完整連續滑動</button><button class="btn ${!showFull?'active':''}" onclick="showFull=false;render()">逐段練習</button>${btn('複製完整介紹',`copyText(INTRO.map(x=>x.answer).join('\\n\\n'))`)}</div>${showFull?all:`<div class="card"><span class="tag">${idx+1} / ${INTRO.length}</span><div class="progress"><div style="width:${(idx+1)/INTRO.length*100}%"></div></div><h2>${esc(x.title)}</h2><div class="cue">記憶關鍵字：${esc(x.hint)}</div><div class="answer">${esc(x.answer)}</div><div class="actions">${btn('← 上一段','jumpIntro('+Math.max(0,idx-1)+')')}${btn('下一段 →','jumpIntro('+Math.min(INTRO.length-1,idx+1)+')')}${btn('複製',`copyText(INTRO[${idx}].answer)`)}${btn('✎ 編輯這段',`editIntro(${idx})`)}</div></div>`}<div class="help">提示：在「逐段練習」時可用 ← → 切換段落。案件順序依本題庫的案件 1～4 排列。</div>`}
function renderQA(){let list=filtered();selected=Math.min(Math.max(0,selected),Math.max(0,list.length-1));let name=section==='favorites'?'收藏題目':section.startsWith('cat:')?section.slice(4):'全部正式題目';let head=`<div class="heading"><div><h1>${esc(name)}</h1><p>找到 ${list.length} 題 · ${mode==='list'?'可連續上下滑動':'單題專注閱讀'}</p></div><span class="tag">正式 ${qa.length} 題</span></div>`;if(!list.length){$('content').innerHTML=head+'<div class="card empty">沒有找到符合條件的題目。請試試其他關鍵字。</div>';return}if(mode==='list'){$('content').innerHTML=head+`<div class="toolbar">${btn('只顯示題目',`toggleListAnswers(false)`)}${btn('展開全部答案',`toggleListAnswers(true)`)}${btn('＋ 新增題目','newQA()')}</div>`+list.map(x=>card(x,showFull)).join('');return}let x=list[selected];let related=list.filter(y=>y.id!==x.id&&y.category===x.category).slice(0,7);$('content').innerHTML=head+`<div class="detail-layout"><div><div class="toolbar">${btn('← 上一題','move(-1)')}${btn('下一題 →','move(1)')}${btn('＋ 新增題目','newQA()')}<span class="tiny muted" style="align-self:center">${selected+1} / ${list.length}</span></div>${card(x,true)}<div class="help">快捷鍵：↑ ↓ 或 ← → 換題，Ctrl+K 搜尋，Esc 清除搜尋。</div></div><aside class="card related"><b>相關題目</b><p class="mini">相同分類的其他問題</p>${related.map(y=>`<button onclick="openQuestion(${y.id})">Q${y.id} · ${esc(y.title)}</button>`).join('')}</aside></div>`}
function render(){categories=[...new Set(qa.map(x=>x.category))];document.body.classList.toggle('compact',compact);$('modeBtn').textContent=mode==='list'?'▣ 單題模式':'☷ 列表模式';$('compactBtn').classList.toggle('active',compact);renderNav();if(section==='intro')renderIntro();else renderQA()}
function setSection(s){section=s;selected=0;render();$('workspace').scrollTop=0}
function visibleQuestionId(){
 const list=filtered();
 if(mode==='single')return list[selected]?.id;
 const cards=[...$('content').querySelectorAll('[data-qid]')];
 const top=$('workspace').getBoundingClientRect().top;
 const visible=cards.find(c=>c.getBoundingClientRect().bottom>top+35);
 return visible?Number(visible.dataset.qid):list[selected]?.id;
}
function restoreQuestion(id){
 if(id==null)return;
 const el=$('content').querySelector('[data-qid="'+id+'"]');
 if(el){const workspace=$('workspace');workspace.scrollTop+=el.getBoundingClientRect().top-workspace.getBoundingClientRect().top-12;}
}
function toggleMode(){
 const id=visibleQuestionId();
 mode=mode==='list'?'single':'list';
 const list=filtered();
 const idx=list.findIndex(x=>x.id===id);
 if(idx>=0)selected=idx;
 render();
 if(mode==='list')restoreQuestion(id);
 else $('workspace').scrollTop=0;
}
function toggleCompact(){const anchor=visibleQuestionId();compact=!compact;render();restoreQuestion(anchor)}
function toggleListAnswers(v){const anchor=visibleQuestionId();showFull=v;render();restoreQuestion(anchor)}
function openQuestion(id){let x=data().find(q=>q.id===id);if(!x)return;section='all';mode='single';searchText='';$('search').value='';selected=filtered().findIndex(q=>q.id===id);render();$('workspace').scrollTop=0}
function move(n){let list=filtered();selected=Math.min(list.length-1,Math.max(0,selected+n));render();$('workspace').scrollTop=0}
function jumpIntro(i){selected=i;showFull=false;render();$('workspace').scrollTop=0}
function star(id){let x=qa.find(q=>q.id===id);if(!x)return;x.starred=!x.starred;localStorage.setItem(KEY,JSON.stringify(qa));render()}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('已複製')).catch(()=>fallbackCopy(t))||fallbackCopy(t)}
function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('已複製')}
function copyAnswer(id){let x=data().find(q=>q.id===id);if(x)copyText(x.title+'\n'+x.answer+(x.followup?'\n追問：'+x.followup:''))}
function toast(s){let e=document.createElement('div');e.textContent=s;e.style.cssText='position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 18px;border-radius:12px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function exportData(){let blob=new Blob([JSON.stringify(qa,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='interview_qa_export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetData(){if(!confirm('確定還原內建題庫？這會覆蓋目前在此網頁儲存的修改與收藏。'))return;qa=structuredClone(ORIGINAL);localStorage.setItem(KEY,JSON.stringify(qa));render()}
$('importFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>Number.isInteger(x.id)&&typeof x.title==='string'&&typeof x.answer==='string'&&typeof x.category==='string'))throw Error('JSON 格式不符合題庫格式');if(!confirm(`匯入 ${a.length} 題並覆蓋目前正式題庫？`))return;qa=a;localStorage.setItem(KEY,JSON.stringify(qa));section='all';selected=0;render();toast('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}});
$('search').addEventListener('input',e=>{searchText=e.target.value;if(section==='intro')section='all';selected=0;render();$('workspace').scrollTop=0});
document.addEventListener('keydown',e=>{let input=document.activeElement=== $('search');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select();return}if(e.key==='Escape'&&input){$('search').value='';searchText='';$('search').blur();render();return}if(input||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(section==='intro'&&!showFull&&['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();jumpIntro(Math.min(INTRO.length-1,Math.max(0,selected+(e.key==='ArrowRight'?1:-1))))}else if(section!=='intro'&&mode==='single'&&['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();move(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)}});

function showFollowup(id){const x=qa.find(q=>q.id===id);if(!x||!x.followup)return;const links=(FOLLOWUP_LINKS[id]||[]).map(n=>qa.find(q=>q.id===n)).filter(Boolean);const overlay=$('followOverlay');overlay.dataset.questionId=String(id);$('followQuestion').textContent=x.followup;$('followAnswer').textContent=x.followupAnswer||x.answer||'回答例はまだ登録されていません。';$('followSource').textContent='來自 Q'+id+'：'+x.title;$('followLinks').innerHTML=links.length?links.map(q=>`<button class="pill" onclick="closeFollowup();openQuestion(${q.id})">Q${q.id} · ${esc(q.title)}</button>`).join(''):'<span style="color:#64748b">暫無對應題目，可用搜尋尋找相近回答。</span>';overlay.classList.remove('hidden')}
function editCurrentFollowup(){const id=Number($('followOverlay').dataset.questionId);if(!id)return;closeFollowup();openEditor('qa',id)}
function closeFollowup(){$('followOverlay').classList.add('hidden')}
function searchFollowup(){const q=$('followQuestion').textContent;closeFollowup();section='all';mode='list';searchText=q;$('search').value=q;render();$('workspace').scrollTop=0}
let editing=null;
function openEditor(kind,id){editing={kind,id};const isIntro=kind==='intro',x=isIntro?INTRO[id]:kind==='new'?{title:'',category:'自己紹介',answer:'',followup:''}:qa.find(q=>q.id===id);if(!x)return; $('editHeading').textContent=isIntro?'編輯履歷介紹段落':kind==='new'?'新增面試題目':`編輯 Q${id}`;$('editTitle').value=x.title||'';$('editCategory').value=x.category||'';$('editAnswer').value=x.answer||'';$('editHint').value=x.hint||'';$('editFollow').value=x.followup||'';$('editFollowAnswer').value=x.followupAnswer||'';$('categoryWrap').classList.toggle('hidden',isIntro);$('hintWrap').classList.toggle('hidden',!isIntro);$('followWrap').classList.toggle('hidden',isIntro);$('deleteEdit').classList.toggle('hidden',isIntro||kind==='new');$('categoryOptions').innerHTML=categories.map(c=>`<option value="${esc(c)}"></option>`).join('');$('editOverlay').classList.remove('hidden');$('editTitle').focus()}
function editQA(id){openEditor('qa',id)}
function editIntro(i){openEditor('intro',i)}
function newQA(){openEditor('new',0)}
function closeEditor(){$('editOverlay').classList.add('hidden');editing=null}
function saveEdited(){if(!editing)return;let title=$('editTitle').value.trim(),answer=$('editAnswer').value.trim();if(!title||!answer){alert('題目和答案不能空白');return}if(editing.kind==='intro'){Object.assign(INTRO[editing.id],{title,answer,hint:$('editHint').value.trim()});localStorage.setItem(INTRO_KEY,JSON.stringify(INTRO))}else{let category=$('editCategory').value.trim();if(!category){alert('請輸入分類');return}let followup=$('editFollow').value.trim(),followupAnswer=$('editFollowAnswer').value.trim();if(editing.kind==='new'){let id=Math.max(153,...qa.map(x=>x.id))+1;qa.push({id,title,category,answer,followup,followupAnswer,starred:false});section='all';mode='single';searchText='';$('search').value='';selected=qa.length-1}else{let x=qa.find(q=>q.id===editing.id);Object.assign(x,{title,category,answer,followup,followupAnswer})}localStorage.setItem(KEY,JSON.stringify(qa))}closeEditor();render();toast('修改已儲存在此瀏覽器')}
function deleteEdited(){if(!editing||editing.kind!=='qa')return;if(!confirm('確定刪除此題？請先匯出 JSON 備份。'))return;qa=qa.filter(q=>q.id!==editing.id);localStorage.setItem(KEY,JSON.stringify(qa));closeEditor();selected=0;render();toast('題目已刪除')}

:#3154ba;border:0;background:transparent;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}.follow-link:hover{color:#17318a}</style></body></html>
